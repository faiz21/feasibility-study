<!DOCTYPE html>
<html lang="en" class="antialiased" data-theme="default">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Assessment Report</title>

    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="report_themes.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        // Bridge Tailwind colors to our CSS variables
                        report: {
                            primary: 'var(--report-primary)',
                            'primary-hover': 'var(--report-primary-hover)',
                            'primary-bg': 'var(--report-primary-bg)',
                            'primary-border': 'var(--report-primary-border)',
                            'primary-text': 'var(--report-primary-text)',

                            bg: 'var(--report-bg)',
                            surface: 'var(--report-surface)',
                            text: 'var(--report-text)',
                            'text-muted': 'var(--report-text-muted)',
                            border: 'var(--report-border)',

                            'accent-orange': 'var(--report-accent-orange)',
                            'accent-red': 'var(--report-accent-red)',
                            'accent-blue': 'var(--report-accent-blue)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: var(--report-bg);
            color: var(--report-text);
        }

        .glass-card {
            background: var(--report-surface);
            border: 1px solid var(--report-border);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .hero-bg {
            background-image: linear-gradient(to right, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.6)), url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=2670&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body class="font-sans leading-relaxed selection:bg-report-primary selection:text-white">

    <!-- THEME SWITCHER (Internal Tooling) -->
    <div class="fixed top-4 right-4 z-[100] flex gap-2">
        <select onchange="document.documentElement.setAttribute('data-theme', this.value)"
            class="bg-white/80 backdrop-blur-md border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-bold uppercase tracking-wider shadow-lg outline-none cursor-pointer">
            <option value="default">Default (Teal)</option>
            <option value="mv-corp">MV Corporate (Blue)</option>
            <option value="dark-obsidian">Dark Obsidian</option>
        </select>
    </div>

    <!-- REPORT ROOT CONTAINER -->
    <div id="report-root">
        <!-- Spinner while loading -->
        <div class="h-screen flex items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-report-primary"></div>
        </div>
    </div>

    <!-- DYNAMIC RENDERER SCRIPT -->
    <script>
        async function loadReport() {
            try {
                const response = await fetch('automation_report_data_refined.json');
                const data = await response.json();
                renderReport(data);
            } catch (err) {
                console.error("Failed to load report data:", err);
                document.getElementById('report-root').innerHTML = `<div class="p-20 text-center text-red-500 font-bold">Error: Failed to load report data. Please ensure automation_report_data_refined.json exists.</div>`;
            }
        }

        function renderReport(data) {
            const root = document.getElementById('report-root');
            root.innerHTML = ''; // Clear spinner

            // 1. Render Cover
            const coverHtml = `
                <section class="h-[90vh] flex flex-col justify-end p-8 md:p-16 lg:p-24 hero-bg text-white relative">
                    <div class="relative z-10 max-w-5xl">
                        <div class="mb-6 inline-flex items-center px-4 py-1.5 rounded-full border border-report-primary/30 bg-report-primary/20 text-white text-sm font-semibold tracking-wide uppercase shadow-lg">
                            ${data.metadata.scope} Maturity Assessment
                        </div>
                        <h1 class="text-6xl md:text-8xl font-black tracking-tight mb-6">
                            ${data.metadata.title}
                        </h1>
                        <h2 class="text-2xl md:text-3xl font-light text-slate-200 mb-12 max-w-3xl leading-snug">
                            ${data.metadata.client}
                        </h2>
                        <div class="flex gap-12 border-t border-white/20 pt-8 mt-12 bg-black/40 backdrop-blur-xl p-8 rounded-3xl">
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">Issue Date</p>
                                <p class="font-medium text-white text-lg">${data.metadata.date}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">Status</p>
                                <p class="font-medium text-report-primary flex items-center gap-2 text-lg">
                                    <span class="w-2.5 h-2.5 rounded-full bg-report-primary animate-pulse"></span>
                                    Final Executive
                                </p>
                            </div>
                        </div>
                    </div>
                </section>
            `;
            root.insertAdjacentHTML('beforeend', coverHtml);

            // 2. Render Main Body
            const main = document.createElement('main');
            main.className = 'max-w-[1440px] mx-auto px-6 md:px-12 py-24 grid grid-cols-1 md:grid-cols-12 gap-y-20 gap-x-8';
            root.appendChild(main);

            data.sections.forEach(section => {
                // Render Section Heading (H1)
                const sectionHeader = `
                    <div class="col-span-1 md:col-span-12">
                        <div class="border-l-[6px] border-report-primary pl-8 py-2">
                            <p class="text-report-primary font-bold tracking-widest uppercase text-sm mb-3">Section ${section.id}</p>
                            <h2 class="text-5xl md:text-6xl font-extrabold text-report-text tracking-tight">${section.title}</h2>
                        </div>
                    </div>
                `;
                main.insertAdjacentHTML('beforeend', sectionHeader);

                // Render Components
                section.components.forEach(comp => {
                    let compHtml = '';
                    switch (comp.type) {
                        case 'NarrativeBlock':
                            compHtml = `
                                <div class="col-span-1 md:col-span-8 md:col-start-3 space-y-6 mt-4">
                                    <h3 class="text-3xl font-bold text-report-text tracking-tight">${comp.title}</h3>
                                    <p class="text-xl font-light text-report-text-muted leading-relaxed">${comp.content}</p>
                                </div>
                            `;
                            break;
                        case 'IconBulletIntro':
                            const itemsHtml = comp.items.map(it => `
                                <li class="flex items-start gap-5">
                                    <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-report-primary-bg text-report-primary-text flex items-center justify-center font-bold border border-report-primary-border">${it.id}</div>
                                    <p class="text-report-text text-lg mt-0.5">${it.text}</p>
                                </li>
                            `).join('');
                            compHtml = `
                                <div class="col-span-1 md:col-span-8 md:col-start-3 glass-card rounded-[2.5rem] p-10 my-10 relative overflow-hidden">
                                    <div class="absolute top-0 right-0 w-32 h-32 bg-report-primary/5 rounded-bl-full -z-10"></div>
                                    <h4 class="text-2xl font-bold text-report-text mb-8 flex items-center gap-4">
                                        <svg class="w-7 h-7 text-report-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                                        ${comp.title}
                                    </h4>
                                    <ul class="space-y-6">${itemsHtml}</ul>
                                </div>
                            `;
                            break;
                        case 'QuoteBlock':
                            compHtml = `
                                <div class="col-span-1 md:col-span-8 md:col-start-3 my-16">
                                    <blockquote class="bg-report-text rounded-[2.5rem] p-12 text-report-surface shadow-2xl relative overflow-hidden transform md:scale-105 border border-white/5">
                                        <div class="absolute -right-12 -top-12 opacity-5">
                                            <svg class="w-48 h-48" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h4v10h-10z"/></svg>
                                        </div>
                                        <div class="absolute left-0 top-0 bottom-0 w-2 bg-report-primary"></div>
                                        <p class="relative z-10 text-2xl md:text-3xl font-light leading-relaxed mb-8">${comp.content}</p>
                                        <div class="flex items-center gap-3 border-t border-white/10 pt-6">
                                            <div class="w-1.5 h-1.5 rounded-full bg-report-primary"></div>
                                            <span class="text-white/50 font-bold tracking-widest text-xs uppercase">Strategic Insight</span>
                                        </div>
                                    </blockquote>
                                </div>
                            `;
                            break;
                        case 'ProcessGroupDashboard':
                            const cardsHtml = comp.cards.map(card => `
                                <div class="glass-card rounded-[2rem] p-8 flex flex-col h-full hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                                    <h3 class="text-xl font-bold text-report-text mb-3">${card.name}</h3>
                                    <p class="text-sm text-report-text-muted mb-6 flex-grow font-light">${card.desc}</p>
                                    <div class="pt-6 border-t border-report-border grid grid-cols-3 gap-2">
                                        <div class="text-center"><p class="text-[10px] font-bold text-report-text-muted uppercase mb-1">L1</p><p class="text-lg font-bold text-report-primary">${card.l1}</p></div>
                                        <div class="text-center"><p class="text-[10px] font-bold text-report-text-muted uppercase mb-1">L2</p><p class="text-lg font-bold text-report-accent-orange">${card.l2}</p></div>
                                        <div class="text-center"><p class="text-[10px] font-bold text-report-text-muted uppercase mb-1">L3</p><p class="text-lg font-bold text-report-accent-red">${card.l3}</p></div>
                                    </div>
                                </div>
                            `).join('');
                            compHtml = `
                                <div class="col-span-1 md:col-span-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 my-10">
                                    ${cardsHtml}
                                </div>
                            `;
                            break;
                        case 'FindingsGrid':
                            const findingsHtml = comp.items.map(f => `
                                <div class="glass-card rounded-2xl p-6 border-l-4 border-l-report-primary">
                                    <h5 class="text-base font-bold text-report-text mb-2">${f.title}</h5>
                                    <p class="text-sm text-report-text-muted font-light leading-snug"><span class="font-bold text-report-primary uppercase text-[10px] block mb-1">Outcome:</span> ${f.impact}</p>
                                </div>
                            `).join('');
                            compHtml = `
                                <div class="col-span-1 md:col-span-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 my-10">
                                    ${findingsHtml}
                                </div>
                            `;
                            break;
                        case 'Paragraph':
                            compHtml = `<div class="col-span-1 md:col-span-8 md:col-start-3 text-lg text-report-text-muted leading-relaxed mb-4">${comp.content}</div>`;
                            break;
                        case 'HighlightList':
                            const listItems = comp.items.map(it => `<li class="flex items-start gap-3"><span class="mt-2 w-1.5 h-1.5 rounded-full bg-report-primary shrink-0"></span><span class="text-report-text-muted">${it}</span></li>`).join('');
                            compHtml = `<div class="col-span-1 md:col-span-8 md:col-start-3 mb-8"><ul class="space-y-3 font-light text-lg">${listItems}</ul></div>`;
                            break;
                        case 'Subheading':
                            compHtml = `<div class="col-span-1 md:col-span-8 md:col-start-3 mt-12 mb-4"><h4 class="text-2xl font-bold text-report-text">${comp.text}</h4></div>`;
                            break;
                        case 'SimpleTable':
                            const th = (comp.headers || []).map(h => `<th class="px-4 py-3 text-left text-xs font-bold uppercase tracking-widest text-report-text-muted border-b border-report-border">${h}</th>`).join('');
                            const tr = (comp.rows || []).map(row => {
                                const tds = (row || []).map(cell => `<td class="px-4 py-3 text-sm text-report-text-muted border-b border-report-border align-top">${cell}</td>`).join('');
                                return `<tr class="hover:bg-report-primary/5 transition-colors">${tds}</tr>`;
                            }).join('');
                            compHtml = `
                                <div class="col-span-1 md:col-span-10 md:col-start-2 my-8">
                                    <div class="glass-card rounded-2xl overflow-hidden">
                                        <div class="overflow-x-auto">
                                            <table class="min-w-full border-separate border-spacing-0">
                                                <thead class="bg-report-primary/5"><tr>${th}</tr></thead>
                                                <tbody>${tr}</tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            `;
                            break;
                    }
                    main.insertAdjacentHTML('beforeend', compHtml);
                });

                // Add horizontal divider between sections
                main.insertAdjacentHTML('beforeend', `<div class="col-span-12 h-px bg-report-border my-12 opacity-50"></div>`);
            });
        }

        // Initialize
        loadReport();
    </script>

</body>

</html>
