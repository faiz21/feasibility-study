        {

        {

    <script>

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        report: {

                            accent: rawData.theme.accent

        };

            background-image: linear-gradient(to right, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.6)), url('https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?q=80&w=2670&auto=format&fit=crop');

<body class="bg-slate-50 text-slate-800 font-sans leading-relaxed selection:bg-report-500 selection:text-white">

    <div id="app"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(document.getElementById('report-data').textContent);
            const app = document.getElementById('app');

            // Utilities
            const renderSectionTitle = (sectionNumber, titleText, subtitleText = '') => `
                <div class="flex items-stretch gap-4 mb-8">
                    <div class="w-1.5 bg-[#0f172a] rounded-full"></div>
                    <div class="py-1">
                        <p class="text-indigo-600 font-bold tracking-widest uppercase text-xs mb-1">${sectionNumber}</p>
                        <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">${titleText}</h2>
                        ${subtitleText ? `<p class="text-sm text-slate-500 mt-2">${subtitleText}</p>` : ''}
                    </div>
                </div>
            `;

            const getExposureBadge = (level) => {
                const text = String(level);
                if (text.includes('Very High')) return 'bg-red-50 text-red-700 border-red-200';
                if (text.includes('High') && !text.includes('Medium')) return 'bg-orange-50 text-orange-700 border-orange-200';
                if (text.includes('Medium-High')) return 'bg-amber-50 text-amber-700 border-amber-200';
                if (text.includes('Medium') && !text.includes('High')) return 'bg-blue-50 text-blue-700 border-blue-200';
                if (text.includes('Low') || text.includes('Limited')) return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                return 'bg-slate-50 text-slate-700 border-slate-200';
            };

            const icons = {
                alert: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`,
                check: `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
            };

            // Recursive Sub-Section Renderer
            const renderSubSection = (sub) => {
                switch(sub.type) {
                    case 'text_block':
                        return `
                            <p class="text-slate-700 text-xl font-light leading-relaxed">${sub.content}</p>
                            ${sub.takeaway ? `
                                <blockquote class="bg-slate-900 rounded-[2.5rem] p-10 text-white shadow-2xl relative overflow-hidden transform md:scale-105 my-12">
                                    <div class="absolute left-0 top-0 bottom-0 w-2.5 bg-gradient-to-b from-indigo-400 to-report-500"></div>
                                    <p class="relative z-10 text-2xl font-light leading-relaxed">${sub.takeaway}</p>
                                </blockquote>
                            ` : ''}
                        `;
                    
                    case 'metrics_grid':
                        return `
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mt-12">
                                ${sub.data.map(snap => `
                                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">${snap.label}</p>
                                        <p class="text-3xl font-black text-indigo-600 mb-1">${snap.value}</p>
                                        <p class="text-xs text-slate-500">${snap.notes}</p>
                                    </div>
                                `).join('')}
                            </div>
                        `;

                    case 'department_cards':
                        return `
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                ${sub.data.map(dept => `
                                    <div class="bg-white rounded-[2rem] p-8 shadow-md hover:shadow-xl transition-shadow border border-slate-200 flex flex-col h-full group">
                                        <div class="flex justify-between items-start mb-6">
                                            <span class="px-3 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded-lg font-mono">${dept.code}</span>
                                            <span class="px-3 py-1 rounded-full text-xs font-bold border ${getExposureBadge(dept.exposure)}">${dept.exposure} Exposure</span>
                                        </div>
                                        <h3 class="text-2xl font-bold text-slate-800 mb-2">${dept.name}</h3>
                                        <p class="text-sm font-semibold text-indigo-600 mb-6 uppercase tracking-wide">${dept.role}</p>
                                        <div class="space-y-4 mb-6 flex-grow">
                                            <div>
                                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Core Mandate</p>
                                                <p class="text-slate-700 text-sm leading-relaxed">${dept.mandate}</p>
                                            </div>
                                        </div>
                                        <div class="pt-5 border-t border-slate-100 mt-auto bg-slate-50 -mx-8 -mb-8 p-8 rounded-b-[2rem]">
                                            <p class="text-[10px] uppercase font-bold text-slate-400 mb-2 tracking-widest">Governance Implication</p>
                                            <p class="text-sm font-medium text-slate-800 leading-snug">${dept.governance}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;

                    case 'exposure_chart':
                        return `
                            <div class="bg-[#0f172a] rounded-3xl p-8 mb-12 shadow-xl border border-slate-800 text-white flex flex-col md:flex-row items-center gap-12">
                                <div class="w-full md:w-1/3">
                                    <h4 class="text-xl font-bold mb-2">${sub.title}</h4>
                                    <p class="text-slate-400 text-sm">${sub.description}</p>
                                </div>
                                <div class="w-full md:w-2/3 flex gap-2 h-16 rounded-xl overflow-hidden shadow-inner">
                                    ${sub.data.map(d => `<div class="${d.color} h-full flex items-center justify-center font-bold text-sm" style="width: ${d.percentage}%" title="${d.label} (${d.value})">${d.percentage > 10 ? `${Math.round(d.percentage)}% ${d.label}` : ''}</div>`).join('')}
                                </div>
                            </div>
                        `;

                    case 'table':
                        const isDark = sub.theme === 'dark';
                        const containerClass = isDark ? "bg-[#0f172a] border-slate-800" : "bg-white border-slate-200";
                        const headerClass = isDark ? "bg-slate-900 border-b border-slate-800 text-slate-400" : "bg-slate-50 border-b border-slate-200 text-slate-500";
                        const rowHover = isDark ? "hover:bg-slate-800/40 text-slate-300" : "hover:bg-slate-50 text-slate-700";
                        const cellBorder = isDark ? "border-slate-800/60" : "border-slate-100";
                        
                        return `
                            <div class="${containerClass} rounded-3xl shadow-sm border overflow-x-auto ${isDark ? 'p-2 md:p-6' : ''}">
                                ${sub.title && !isDark ? `<div class="p-6 bg-slate-50 border-b border-slate-200"><h4 class="text-lg font-bold text-slate-800">${sub.title}</h4></div>` : ''}
                                ${sub.title && isDark ? `<div class="p-4"><h4 class="text-sm font-bold text-slate-400 tracking-widest uppercase mb-4">${sub.title}</h4></div>` : ''}
                                <table class="w-full text-left min-w-[700px]">
                                    <thead>
                                        <tr class="${headerClass} uppercase text-xs tracking-wider">
                                            ${sub.headers.map(h => `<th class="p-4 font-bold">${h}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody class="text-sm divide-y ${cellBorder}">
                                        ${sub.rows.map(row => `
                                            <tr class="${rowHover} transition-colors">
                                                ${row.map((cell, idx) => {
                                                    let isBadge = sub.badgeColumns && sub.badgeColumns.includes(idx);
                                                    if(isBadge) {
                                                        return `<td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold border ${getExposureBadge(cell)}">${cell}</span></td>`;
                                                    }
                                                    return `<td class="p-4 ${idx===0 ? 'font-medium '+(isDark?'text-white':'text-slate-900') : ''}">${cell}</td>`;
                                                }).join('')}
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;

                    case 'accountability_cards':
                        return `
                            <div class="space-y-8">
                                ${sub.data.map(card => `
                                    <div class="bg-white rounded-2xl p-8 border border-slate-200 shadow-sm relative overflow-hidden">
                                        <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-${card.color}-500"></div>
                                        <h4 class="text-xl font-bold text-slate-800 mb-2">${card.title}</h4>
                                        <p class="text-xs font-mono text-slate-400 mb-4">${card.anchor}</p>
                                        <ul class="space-y-3 text-sm text-slate-700">
                                            ${card.items.map(item => `
                                                <li class="${item.alert ? `text-${card.color}-700 bg-${card.color}-50 p-3 rounded-lg mt-3 border border-${card.color}-100` : ''}">
                                                    <strong class="font-semibold text-slate-900">${item.label}:</strong> ${item.text}
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                `).join('')}
                            </div>
                        `;

                    case 'colored_lists':
                        return `
                            <div class="space-y-6">
                                ${sub.lists.map(list => `
                                    <div class="bg-${list.color}-50 rounded-2xl p-6 border border-${list.color}-100 shadow-sm">
                                        <h4 class="text-sm font-bold text-${list.color}-800 uppercase tracking-widest mb-4 flex items-center gap-2">
                                            ${icons[list.icon] || ''} ${list.title}
                                        </h4>
                                        <ul class="space-y-3 text-sm text-${list.color}-900 list-disc pl-5">
                                            ${list.items.map(item => `<li>${item}</li>`).join('')}
                                        </ul>
                                    </div>
                                `).join('')}
                            </div>
                        `;

                    case 'executive_list':
                        return `
                            <div class="bg-[#0f172a] rounded-[3rem] p-12 md:p-20 text-white shadow-2xl relative overflow-hidden mb-12">
                                <div class="absolute right-0 top-0 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                                <div class="mb-12 relative z-10">
                                    <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-8">Executive Framing</h2>
                                </div>
                                <ul class="space-y-6 relative z-10 max-w-4xl">
                                    ${sub.items.map((item, i) => `
                                        <li class="flex items-start gap-5">
                                            <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-300 flex items-center justify-center font-bold border border-indigo-500/30 shrink-0">${i+1}</div>
                                            <p class="text-xl text-slate-200 font-light leading-relaxed mt-0.5">${item}</p>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `;

                    case 'reference_map':
                        return `
                            <div class="bg-white rounded-[2rem] p-8 md:p-12 shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-slate-200 overflow-x-auto">
                                <table class="w-full text-left min-w-[600px]">
                                    <thead>
                                        <tr class="text-slate-400 uppercase text-[10px] tracking-widest border-b border-slate-200">
                                            ${sub.headers.map(h => `<th class="p-4 pb-4 font-bold">${h}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody class="text-slate-700 text-sm divide-y divide-slate-100">
                                        ${sub.rows.map(row => `
                                            <tr class="hover:bg-slate-50 transition-colors group">
                                                <td class="p-4 py-5 font-bold text-slate-900 text-base w-1/3">${row[0]}</td>
                                                <td class="p-4 py-5 w-2/3">
                                                    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md bg-slate-100 text-slate-600 border border-slate-200 text-xs font-medium font-mono group-hover:bg-indigo-50 group-hover:text-indigo-700 group-hover:border-indigo-200 transition-colors">
                                                        ${row[1]}
                                                    </div>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;

                    case 'two_column_grid':
                        return `
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 w-full">
                                <div class="w-full space-y-8">
                                    ${sub.leftSubSections.map(ls => renderSubSection(ls)).join('')}
                                </div>
                                <div class="w-full space-y-8">
                                    ${sub.rightSubSections.map(rs => renderSubSection(rs)).join('')}
                                </div>
                            </div>
                        `;

                    default:
                        return `<div>Unknown block type: ${sub.type}</div>`;
                }
            };

            // Main Generator
            const coverHtml = `
                <section class="h-[95vh] flex flex-col justify-end p-8 md:p-16 lg:p-24 hero-bg text-white relative">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent mix-blend-multiply"></div>
                    <div class="relative z-10 max-w-5xl">
                        <div class="mb-6 inline-flex items-center px-4 py-1.5 rounded-full border border-report-500/50 bg-report-500/20 text-indigo-100 text-sm font-semibold tracking-wide uppercase shadow-lg">
                            ${data.metadata.documentId}
                        </div>
                        <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-4 text-white drop-shadow-sm">
                            ${data.metadata.title.split(' ')[0]} <br/> <span class="text-report-500">${data.metadata.title.split(' ').slice(1).join(' ')}</span>
                        </h1>
                        <h2 class="text-2xl md:text-3xl font-light text-slate-300 mb-12 max-w-3xl leading-snug">
                            ${data.metadata.subtitle}
                        </h2>

                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 border-t border-white/20 pt-8 mt-12 dark-glass rounded-3xl p-8 shadow-2xl backdrop-blur-xl items-center">
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Facility Scope</p>
                                <p class="font-medium text-white text-lg">${data.metadata.plant}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Assess. Domain</p>
                                <p class="font-medium text-white text-lg">${data.metadata.domain}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Issue Date</p>
                                <p class="font-medium text-white text-lg">${data.metadata.date}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Status</p>
                                <p class="font-medium text-indigo-400 flex items-center gap-2 text-lg">
                                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse shadow-[0_0_8px_rgba(99,102,241,0.8)]"></span>
                                    ${data.metadata.status}
                                </p>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            let mainHtml = `<main class="max-w-[1440px] mx-auto px-6 md:px-12 py-24 flex flex-col gap-y-24">`;

            data.sections.forEach((sec, idx) => {
                const sectionNum = sec.sectionNumber || `Section ${String(idx + 1).padStart(2, '0')}`;
                mainHtml += `
                    <div class="${idx > 0 ? 'border-t border-slate-200 pt-16' : ''} w-full">
                        ${renderSectionTitle(sectionNum, sec.title, sec.subtitle)}
                        <div class="w-full space-y-12">
                            ${sec.subSections.map(sub => renderSubSection(sub)).join('')}
                        </div>
                    </div>
                `;
            });

            mainHtml += `</main>`;
            app.innerHTML = coverHtml + mainHtml;
        });
    </script>
</body>
</html>
