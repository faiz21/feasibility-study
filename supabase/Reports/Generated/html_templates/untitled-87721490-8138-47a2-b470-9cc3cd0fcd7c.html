              ["SCADA Integration", "Limited (2 PLC-linked groups connected)", "High", "Majority of PLC groups are PLC-local; multi-SCADA present."],

    <script>
        // Synchronously load theme colors into Tailwind config before rendering
        const rawData = JSON.parse(document.getElementById('report-data').textContent);
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        report: {
                            50: '#eef2ff', 
                            100: '#e0e7ff',

                            800: '#3730a3', 
                            900: rawData.theme.dark, 
                            accent: rawData.theme.accent, 
                            roadmapBg: rawData.theme.roadmapBg

            }
        };

<body class="bg-slate-50 text-slate-800 font-sans leading-relaxed selection:bg-report-500 selection:text-white">

    <div id="app"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(document.getElementById('report-data').textContent);
            const app = document.getElementById('app');

            // UTILITIES
            const getRiskBadge = (exposure) => {
                const map = {
                    'High': 'bg-red-50 text-red-700 border-red-200',
                    'Medium': 'bg-orange-50 text-orange-700 border-orange-200',
                    'Low': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                    'To validate': 'bg-slate-100 text-slate-600 border-slate-300'
                };
                return map[exposure] || 'bg-slate-50 text-slate-700 border-slate-200';
            };

            const formatTitle = (title) => {
                const words = title.split(' ');
                if(words.length > 2) {
                    return `${words[0]} <br/> <span class="text-report-500">${words.slice(1).join(' ')}</span>`;
                }
                return title;
            };

            // COMPONENT RENDERERS
            const renderSectionTitle = (title, isSub = false) => {
                if (isSub) {
                    return `<h3 class="text-2xl font-bold text-[#0f172a] tracking-tight mb-8 mt-10">${title}</h3>`;
                }
                return `
                    <div class="flex items-stretch gap-4 mb-10">
                        <div class="w-2 bg-[#0f172a] rounded-sm"></div>
                        <div class="py-1">
                            <h2 class="text-3xl font-bold text-[#0f172a] tracking-tight leading-none flex items-center h-full">${title}</h2>
                        </div>
                    </div>
                `;
            };

            // New component rendering the cards + a beautiful overlapping CSS Venn diagram
            const renderMetricsWithVenn = (dataArray) => {
                const cardsHtml = `
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 xl:gap-5 mb-10">
                        ${dataArray.map(m => `
                            <div class="bg-white rounded-2xl py-10 px-4 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 flex flex-col justify-center items-center text-center hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                                <p class="text-5xl font-extrabold text-[#0f172a] mb-5 tracking-tight">${m.value}</p>
                                <p class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.15em] leading-relaxed max-w-[120px]">${m.label}</p>
                            </div>
                        `).join('')}
                    </div>
                `;

                const vennHtml = `
                    <div class="bg-white rounded-[2.5rem] p-8 md:p-12 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 flex flex-col lg:flex-row items-center gap-12 mt-8">
                        
                        <!-- VENN DIAGRAM GRAPHIC -->
                        <div class="relative w-80 h-80 shrink-0 flex items-center justify-center">
                            
                            <!-- Outer Universe (Total 8) -->
                            <div class="absolute inset-0 rounded-full border-2 border-dashed border-slate-200 bg-slate-50/50 flex items-start justify-center pt-8">
                                <span class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Total Process Groups (8)</span>
                            </div>

                            <!-- PLC Based -->
                            <div class="absolute top-16 left-6 w-48 h-48 rounded-full mix-blend-multiply bg-blue-100 border border-blue-200 flex flex-col items-center justify-center shadow-sm z-10 hover:scale-105 transition-transform cursor-default">
                                <span class="text-blue-900 font-bold text-4xl mb-1">5</span>
                                <span class="text-blue-700 text-[10px] font-bold uppercase tracking-widest text-center leading-tight">PLC-Based</span>
                            </div>

                            <!-- SCADA Connected -->
                            <div class="absolute top-28 left-36 w-36 h-36 rounded-full mix-blend-multiply bg-teal-100 border border-teal-200 flex flex-col items-center justify-center shadow-sm z-20 hover:scale-105 transition-transform cursor-default">
                                <span class="text-teal-900 font-bold text-3xl mb-1">2</span>
                                <span class="text-teal-700 text-[10px] font-bold uppercase tracking-widest text-center leading-tight">SCADA<br>Linked</span>
                            </div>
                            
                            <!-- Relay/Hybrid -->
                            <div class="absolute bottom-10 right-10 w-28 h-28 rounded-full mix-blend-multiply bg-orange-100 border border-orange-200 flex flex-col items-center justify-center shadow-sm z-30 hover:scale-105 transition-transform cursor-default">
                                <span class="text-orange-900 font-bold text-2xl mb-1">1</span>
                                <span class="text-orange-700 text-[9px] font-bold uppercase tracking-widest text-center leading-tight">Relay /<br>Hybrid</span>
                            </div>
                        </div>

                        <!-- EXPLANATION/LEGEND -->
                        <div class="flex-grow space-y-6">
                            <div>
                                <h4 class="text-xl font-bold text-slate-800 mb-2">Architectural Coverage Breakdown</h4>
                                <p class="text-slate-600 text-sm leading-relaxed">This diagram visualizes the intersection of control capabilities across the 8 process groups within the plant.</p>
                            </div>
                            
                            <div class="space-y-4">
                                <div class="flex items-start gap-4">
                                    <div class="w-3 h-3 rounded-full bg-blue-400 mt-1.5 shrink-0"></div>
                                    <div>
                                        <p class="font-bold text-slate-800 text-sm">PLC-Based Dominance</p>
                                        <p class="text-xs text-slate-500 mt-0.5 leading-relaxed">5 out of 8 groups feature programmable logic controllers, forming the foundation for any digital transformation, with 4 identified as modern.</p>
                                    </div>
                                </div>
                                <div class="flex items-start gap-4">
                                    <div class="w-3 h-3 rounded-full bg-teal-400 mt-1.5 shrink-0"></div>
                                    <div>
                                        <p class="font-bold text-slate-800 text-sm">Supervisory Gap (SCADA)</p>
                                        <p class="text-xs text-slate-500 mt-0.5 leading-relaxed">Only 2 of the 5 PLC-based groups have confirmed SCADA integration, highlighting a critical visibility gap for centralized monitoring.</p>
                                    </div>
                                </div>
                                <div class="flex items-start gap-4">
                                    <div class="w-3 h-3 rounded-full bg-orange-400 mt-1.5 shrink-0"></div>
                                    <div>
                                        <p class="font-bold text-slate-800 text-sm">Legacy / Relay Exposure</p>
                                        <p class="text-xs text-slate-500 mt-0.5 leading-relaxed">1 group explicitly relies on relay-dominant/hybrid controls, preventing systematic stop-cause capture. (Note: 2 remaining groups require validation).</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                return cardsHtml + vennHtml;
            };

            const renderMetrics = (dataArray) => `
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 xl:gap-5 mb-12">
                    ${dataArray.map(m => `
                        <div class="bg-white rounded-2xl py-10 px-4 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 flex flex-col justify-center items-center text-center hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                            <p class="text-5xl font-extrabold text-[#0f172a] mb-5 tracking-tight">${m.value}</p>
                            <p class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.15em] leading-relaxed max-w-[120px]">${m.label}</p>
                        </div>
                    `).join('')}
                </div>
            `;

            const renderCards = (dataArray) => `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    ${dataArray.map(p => `
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm h-full flex flex-col">
                            <h5 class="font-bold text-slate-800 mb-2">${p.title}</h5>
                            <p class="text-sm text-slate-600 flex-grow">${p.desc}</p>
                        </div>
                    `).join('')}
                </div>
            `;

            const renderTable = (tableData) => `
                <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden table-container overflow-x-auto mb-16">
                    <table class="w-full text-left min-w-[1000px] border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-white uppercase text-xs tracking-wider">
                                ${tableData.headers.map((h, i) => `<th class="p-4 font-semibold ${i===0?'rounded-tl-3xl':''}">${h}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody class="text-slate-700 text-sm divide-y divide-slate-100">
                            ${tableData.rows.map(row => `
                                <tr class="hover:bg-slate-50 transition-colors">
                                    ${row.map((cell, i) => {
                                        if (['High', 'Medium', 'Low', 'To validate'].includes(cell)) {
                                            return `<td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold border ${getRiskBadge(cell)}">${cell}</span></td>`;
                                        }
                                        if (i === 0 && cell.includes('-')) {
                                            return `<td class="p-4 font-mono font-bold text-indigo-700 whitespace-nowrap">${cell}</td>`;
                                        }
                                        return `<td class="p-4">${cell}</td>`;
                                    }).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            const renderTableDark = (tableData) => `
                <div class="bg-[#0f172a] rounded-[2.5rem] p-8 md:p-12 overflow-hidden shadow-2xl border border-slate-800">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                                ${tableData.headers.map((h, i) => `<th class="p-4 pb-4 font-bold ${i===0?'w-1/4':''}">${h}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody class="text-slate-300 text-sm divide-y divide-slate-800/60">
                            ${tableData.rows.map(row => `
                                <tr class="hover:bg-slate-800/40 transition-colors">
                                    <td class="p-4 py-5 font-bold text-white whitespace-nowrap">${row[0]}</td>
                                    <td class="p-4 py-5 leading-relaxed text-indigo-300 max-w-2xl">${row[1]}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            const renderRiskProfiles = (dataArray) => `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    ${dataArray.map(g => `
                        <div class="bg-white rounded-[2rem] p-8 shadow-md border border-slate-200 flex flex-col h-full hover:shadow-xl transition-shadow relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1.5 bg-indigo-500"></div>
                            <div class="mb-6">
                                <span class="text-[10px] font-mono font-bold bg-slate-100 text-slate-500 px-2 py-1 rounded">${g.code}</span>
                                <h4 class="text-xl font-bold text-slate-800 mt-3 leading-tight">${g.name}</h4>
                            </div>
                            <p class="text-slate-600 text-sm mb-6 pb-6 border-b border-slate-100 leading-relaxed">${g.scope}</p>
                            <div class="space-y-4 flex-grow">
                                <div>
                                    <p class="text-xs font-bold text-slate-800 uppercase tracking-wide mb-1 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 bg-orange-400 rounded-full"></span> Observation
                                    </p>
                                    <p class="text-sm text-slate-600 leading-relaxed">${g.observation}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-slate-800 uppercase tracking-wide mb-1 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span> Operational Effect
                                    </p>
                                    <p class="text-sm text-slate-600 leading-relaxed">${g.effect}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-slate-800 uppercase tracking-wide mb-1 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> Governance Implication
                                    </p>
                                    <p class="text-sm text-slate-600 leading-relaxed">${g.implication}</p>
                                </div>
                            </div>
                            <div class="pt-6 mt-6 border-t border-slate-100 bg-slate-50 -mx-8 -mb-8 p-8 rounded-b-[2rem]">
                                <p class="text-[10px] uppercase font-bold text-indigo-500 mb-2 tracking-widest">Target State</p>
                                <p class="text-sm font-medium text-slate-800 leading-snug">${g.target}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            const renderPurpose = (dataObj) => `
                <div class="space-y-10 text-xl font-light">
                    <p class="text-slate-700 leading-relaxed max-w-4xl">${dataObj.text}</p>
                    <blockquote class="bg-slate-900 rounded-[2.5rem] p-10 text-white shadow-2xl relative overflow-hidden max-w-4xl">
                        <div class="absolute left-0 top-0 bottom-0 w-2.5 bg-gradient-to-b from-indigo-400 to-report-500"></div>
                        <p class="relative z-10 text-xl font-light leading-relaxed">${dataObj.takeaway}</p>
                    </blockquote>
                </div>
            `;

            const renderExecutive = (dataArray) => `
                <div class="bg-indigo-50 border border-indigo-100 rounded-3xl p-8 shadow-sm max-w-4xl">
                    <h4 class="text-xl font-bold text-indigo-900 mb-6 flex items-center gap-3">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Key Takeaways
                    </h4>
                    <ul class="space-y-4 text-base text-indigo-800 list-disc pl-5">
                        ${dataArray.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                </div>
            `;

            const renderObservations = (dataArray) => `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-4">
                    ${dataArray.map((obs, index) => `
                        <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-lg shadow-slate-200/50 hover:-translate-y-2 transition-transform">
                            <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                                <div class="px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 font-bold text-sm border border-indigo-100">0${index+1}</div>
                                <h3 class="text-lg font-bold text-slate-800 leading-tight">${obs.title}</h3>
                            </div>
                            <p class="text-slate-600 text-sm leading-relaxed">${obs.text}</p>
                        </div>
                    `).join('')}
                </div>
            `;

            const renderDefinitions = (dataArray) => `
                <div class="bg-slate-900 rounded-[2rem] p-8 text-white shadow-xl mb-8">
                    <ul class="space-y-4">
                        ${dataArray.map(d => `
                            <li class="flex items-start gap-3">
                                <svg class="w-5 h-5 text-indigo-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span class="text-sm font-light text-slate-300">${d}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;

            const renderClusters = (dataArray) => `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    ${dataArray.map(cluster => `
                        <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">
                            <h5 class="text-sm font-bold text-slate-500 uppercase tracking-wide mb-3">${cluster.name}</h5>
                            <div class="flex flex-wrap gap-2">
                                ${cluster.tags.map(t => `<span class="bg-indigo-50 text-indigo-700 text-xs font-mono font-bold px-2 py-1 rounded border border-indigo-100">${t}</span>`).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            const renderComponent = (type, componentData) => {
                switch (type) {
                    case 'purpose': return renderPurpose(componentData);
                    case 'metrics': return renderMetrics(componentData);
                    case 'metrics_with_venn': return renderMetricsWithVenn(componentData);
                    case 'cards': return renderCards(componentData);
                    case 'table': return renderTable(componentData);
                    case 'table_dark': return renderTableDark(componentData);
                    case 'risk_profiles': return renderRiskProfiles(componentData);
                    case 'executive': return renderExecutive(componentData);
                    case 'observations': return renderObservations(componentData);
                    case 'definitions': return renderDefinitions(componentData);
                    case 'clusters': return renderClusters(componentData);
                    default: return `<p class="text-red-500">Unknown component type: ${type}</p>`;
                }
            };

            // MAIN RENDERING
            let mainHtml = `
                <!-- HERO SECTION -->
                <section class="h-[95vh] flex flex-col justify-end p-8 md:p-16 lg:p-24 hero-bg text-white relative">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent mix-blend-multiply"></div>
                    <div class="relative z-10 max-w-5xl">
                        <div class="mb-6 inline-flex items-center px-4 py-1.5 rounded-full border border-report-500/50 bg-report-500/20 text-indigo-100 text-sm font-semibold tracking-wide uppercase shadow-lg">
                            ${data.metadata.documentId}
                        </div>
                        <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-4 text-white drop-shadow-sm">
                            ${formatTitle(data.metadata.title)}
                        </h1>
                        <h2 class="text-2xl md:text-3xl font-light text-slate-300 mb-12 max-w-3xl leading-snug">
                            ${data.metadata.subtitle}
                        </h2>

                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 border-t border-white/20 pt-8 mt-12 dark-glass rounded-3xl p-8 shadow-2xl backdrop-blur-xl items-center">
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Facility</p>
                                <p class="font-medium text-white text-lg">${data.metadata.facility}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Company</p>
                                <p class="font-medium text-white text-lg">${data.metadata.company}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Issue Date</p>
                                <p class="font-medium text-white text-lg">${data.metadata.date}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Status</p>
                                <p class="font-medium text-report-500 flex items-center gap-2 text-lg">
                                    <span class="w-2.5 h-2.5 rounded-full bg-report-500 animate-pulse shadow-[0_0_8px_rgba(79,70,229,0.8)]"></span>
                                    ${data.metadata.status}
                                </p>
                            </div>
                        </div>
                    </div>
                </section>

                <main class="max-w-[1440px] mx-auto px-6 md:px-12 py-24 grid grid-cols-1 md:grid-cols-12 gap-y-16 gap-x-8">
            `;

            // DYNAMIC SECTION RENDERING
            data.sections.forEach((section) => {
                let sectionContent = '';
                
                sectionContent += renderSectionTitle(section.title);

                if (section.subsections && section.subsections.length > 0) {
                    section.subsections.forEach((sub) => {
                        sectionContent += renderSectionTitle(sub.title, true);
                        sectionContent += renderComponent(sub.type, sub.data);
                    });
                } else if (section.type) {
                    sectionContent += `<div class="mt-8">` + renderComponent(section.type, section.data) + `</div>`;
                }

                mainHtml += `<div class="col-span-1 md:col-span-12 mt-8 border-t border-slate-200 pt-16">${sectionContent}</div>`;
            });

            mainHtml += `</main>`;
            app.innerHTML = mainHtml;
        });
    </script>
</body>
</html>
