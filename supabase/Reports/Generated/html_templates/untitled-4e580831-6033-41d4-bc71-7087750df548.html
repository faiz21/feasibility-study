                const map = {
                    'High': 'bg-red-50 text-red-700 border-red-200',
                    'Medium': 'bg-orange-50 text-orange-700 border-orange-200',
                    'To validate': 'bg-slate-100 text-slate-600 border-slate-300'

            };

                let currentPct = 0;
                const gradientString = chart.data.map(item => {
                    const pct = (item.value / chart.total) * 100;
                    const str = `${item.color} ${currentPct}% ${currentPct + pct}%`;
                    currentPct += pct;
                    return str;
                }).join(', ');

                return `
                    <div class="flex flex-col xl:flex-row items-center justify-center gap-8 w-full">
                        <div class="w-36 h-36 rounded-full shadow-inner border border-slate-100 flex-shrink-0" style="background: conic-gradient(${gradientString})"></div>
                        <div class="space-y-4 w-full max-w-sm">
                            ${chart.data.map(item => `
                                <div class="flex items-start gap-3">
                                    <div class="w-4 h-4 rounded-full mt-0.5 shadow-sm shrink-0" style="background-color: ${item.color}"></div>

                                                                <div class="w-full bg-slate-100 rounded-full h-2.5 flex overflow-hidden">
                                                                    <div class="bg-blue-500 h-2.5 rounded-full" style="width: ${(item.di / item.max) * 100}%"></div>
                                                                </div>
                                                                <div class="w-full bg-slate-100 rounded-full h-2.5 flex overflow-hidden">
                                                                    <div class="bg-teal-400 h-2.5 rounded-full" style="width: ${(item.do / item.max) * 100}%"></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            ` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- SECTION 5: RISK POSTURE -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle('Section 05', 'Control Layer Risk Posture')}
                        
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wider border-b border-slate-200">
                                        <th class="p-5 font-bold">Dimension</th>
                                        <th class="p-5 font-bold">Current Posture</th>
                                        <th class="p-5 font-bold">Exposure Level</th>
                                        <th class="p-5 font-bold">Notes</th>
                                    </tr>
                                </thead>
                                <tbody class="text-slate-800 text-sm divide-y divide-slate-100">
                                    ${data.sections.riskPosture.map(risk => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-5 font-bold text-slate-700">${risk.dimension}</td>
                                            <td class="p-5">${risk.posture}</td>
                                            <td class="p-5">
                                                <span class="px-3 py-1 rounded-full text-xs font-bold border ${getRiskBadge(risk.exposure)}">
                                                    ${risk.exposure}
                                                </span>
                                            </td>
                                            <td class="p-5 text-slate-600">${risk.notes}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- SECTION 6 & 7: PRIORITIES & REFERENCE MAP (UPSIDE / DOWNSIDE STACKED) -->
                    <div class="col-span-1 md:col-span-12 flex flex-col gap-16 mt-12 border-t border-slate-200 pt-16 mb-24">
                        
                        <!-- Priorities (Upside) -->
                        <div class="w-full">
                            ${renderSectionTitle('Section 06', 'Improvement Priorities', 'Derived strictly from deterministic gaps')}
                            <ul class="space-y-4 max-w-5xl">
                                ${data.sections.priorities.map(priority => `
                                    <li class="flex items-center gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                        <div class="w-6 h-6 rounded-full border-2 border-blue-500 flex items-center justify-center shrink-0">
                                            <svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                        <p class="text-base text-slate-700 font-medium leading-relaxed">${priority}</p>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <!-- Reference Map (Downside) -->
                        <div class="w-full">
                            ${renderSectionTitle('Appendix D', 'Reference Map', 'Output 5B Verification')}
                            
                            <div class="bg-[#0f172a] rounded-[2.5rem] p-6 md:p-10 overflow-hidden shadow-2xl border border-slate-800">
                                <table class="w-full text-left">
                                    <thead>
                                        <tr class="text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                                            <th class="p-4 pb-6 font-bold">Section</th>
                                            <th class="p-4 pb-6 font-bold">Evidence Inputs Used</th>
                                            <th class="p-4 pb-6 font-bold">Key Anchors</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-slate-300 text-sm divide-y divide-slate-800/60">
                                        ${data.sections.referenceMap.map(ref => `
                                            <tr class="hover:bg-slate-800/40 transition-colors">
                                                <td class="p-4 py-6 font-bold text-white whitespace-nowrap">${ref.section}</td>
                                                <td class="p-4 py-6 leading-relaxed text-slate-300 max-w-xl">${ref.inputs}</td>
                                                <td class="p-4 py-6 font-mono text-xs text-blue-300">${ref.anchors}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </main>
            `;
            
            app.innerHTML = html;
        });
    </script>
</body>
</html>
