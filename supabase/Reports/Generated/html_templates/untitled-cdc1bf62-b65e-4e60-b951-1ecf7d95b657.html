<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Manufacturing Assessment Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- GENERIC JSON DATA EMBED: Sections -> Sub-sections Structure -->
    <script id="report-data" type="application/json">
    {
      "theme": {
        "primary": "#10b981",
        "primaryLight": "#d1fae5",
        "primaryDark": "#065f46",
        "dark": "#0f172a"
      },
      "metadata": {
        "documentId": "INA-PL-GRP-APP-A",
        "title": "Appendix A",
        "subtitle": "Material & Manufacturing Architecture",
        "status": "Output 2A — Baseline",
        "attributes": [
          { "label": "Plant ID", "value": "INA-PL-GRP" },
          { "label": "Facility", "value": "Green Plant" },
          { "label": "Document Code", "value": "INA-PL-GRP-APP-A" },
          { "label": "Scope", "value": "Process Foundation", "valueClass": "text-report-500 font-bold" }
        ]
      },
      "sections": [
        {
          "title": "Purpose of Appendix A",
          "subsections": [
            {
              "type": "narrative",
              "paragraphs": [
                "Appendix A consolidates the material flow architecture, monitoring posture, charging and changeover logic, detailed manufacturing steps, and process risk exposure for Green Plant (INA-PL-GRP) into a single operational baseline.",
                "This appendix establishes the manufacturing reference model that underpins all subsequent appendices. It describes how materials physically and logically flow through the Green Plant before evaluating automation, governance, or digital maturity layers."
              ],
              "takeaway": "Appendix A serves as the <strong class=\"font-medium text-white\">process-first foundation</strong> of the plant assessment. <span class=\"text-report-500 font-medium\">No maturity scores are assigned in this section.</span>"
            }
          ]
        },
        {
          "title": "Material Architecture Overview",
          "description": "Material categories derived strictly from Process Elicitation Results, Findings, Issues, and Equipment references.",
          "subsections": [
            {
              "title": "Material Categories",
              "type": "card-grid",
              "cards": [
                {
                  "title": "Raw Materials (RM)",
                  "theme": "blue",
                  "items": ["Coke / Kokas (HS/LS)", "Butt (spent anode butt)", "Green Scrap", "CTP / Tar Pitch"]
                },
                {
                  "title": "Work in Progress",
                  "theme": "orange",
                  "items": ["Sized coke fractions", "Sized butt fractions", "Pre-heated mixed material", "Homogeneous paste", "Formed Green Anode", "Cooled / Aged Green Block"]
                },
                {
                  "title": "Transfer Output",
                  "theme": "emerald",
                  "items": ["Green Block transferred to Baking Plant", "Traceable Baked Block after cooling"]
                },
                {
                  "title": "By-Products / Reject",
                  "theme": "red",
                  "items": ["Green Scrap return", "Butt recycle stream", "<span class='text-red-600 font-medium'>Green Anode reject (<0.5%)</span>", "<span class='text-red-600 font-medium'>Startup scrap (~40 mins bypass)</span>"]
                }
              ]
            }
          ]
        },
        {
          "title": "Material Flow Architecture",
          "subsections": [
            {
              "title": "Logical Flow Stages & Transformation",
              "type": "flow-stepper",
              "flowTitle": "Logical Flow Stages",
              "stages": [
                { "name": "Coke Vessel Unloading", "highlight": false },
                { "name": "Coke Receiving & Silo Storage", "highlight": false },
                { "name": "Coke Grinding & Screening", "highlight": false },
                { "name": "Butt & Green Scrap Receiving", "highlight": false },
                { "name": "Blending & Kneading", "highlight": true },
                { "name": "Anode Forming", "highlight": true },
                { "name": "Cooling & Aging", "highlight": false },
                { "name": "Green Block Conveying", "highlight": false },
                { "name": "Utility Support", "highlight": false },
                { "name": "Transfer to Baking Plant", "highlight": false }
              ],
              "summaryBoxes": [
                {
                  "title": "Textual Stage Flow",
                  "content": "Inbound Coke/Butt → Silo Segregation (HS/LS) → Screening & Fraction Binning → Recipe Dosing → Pre-Heating → Kneading → Forming → Cooling & Aging → Labeling → Yard Handling → Dispatch",
                  "theme": "dark"
                },
                {
                  "title": "Segregation Logic",
                  "content": "High Sulfur (HS) vs Low Sulfur (LS) coke split (~60% / 40%)",
                  "theme": "blue"
                }
              ],
              "bulletBox": {
                "title": "Critical Transformation Nodes",
                "items": [
                  "Physical size reduction (crusher, trommel, cyclone)",
                  "Thermal conditioning (pre-heating, heating oil)",
                  "Mechanical homogenization (kneader)",
                  "Mechanical compaction (shaking machine)"
                ]
              }
            }
          ]
        },
        {
          "title": "Monitoring & Accuracy Assessment",
          "subsections": [
            {
              "title": "Monitoring Coverage Table",
              "type": "table",
              "headers": ["Stage", "Monitoring Mechanism", "Accuracy Dependency"],
              "rows": [
                ["Coke Receiving", "PLC Coke Receiving", "Conveyor RPM manual; sensor drift"],
                ["Coke Silo Level", "Level sensors + manual", "<span class='text-red-600 font-medium'>Dust interference causes inaccuracy</span>"],
                ["Coke Mass Flow", "Belt load cell", "<span class='text-red-600 font-medium'>Measurement variance (12% dev)</span>"],
                ["Kneader", "PLC Logix-5583E; ampere/KWh", "Partial data not fully integrated"],
                ["Alarm Logging", "<span class='text-orange-600 font-medium'>No automatic alarm log</span>", "No historian traceability"]
              ]
            },
            {
              "title": "Monitoring Maturity Assessment",
              "type": "split-cards",
              "leftCard": {
                "title": "Strengths",
                "theme": "report",
                "items": [
                  "Dedicated PLCs for kneader, forming, coke receiving.",
                  "Defined process parameters (forming temp 150–170°C).",
                  "SCADA present (Granulation SCADA; Vibration SCADA)."
                ]
              },
              "rightCard": {
                "title": "Limitations",
                "theme": "red",
                "items": [
                  "Silo level drift due to dust.",
                  "Load cell mass flow not trusted (12% dev).",
                  "Manual QC recording and transcription.",
                  "No alarm logging system or SPC implementation."
                ]
              },
              "conclusion": "Limited to Moderate monitoring maturity"
            }
          ]
        },
        {
          "title": "Charging Planning & Changeover Logic",
          "subsections": [
            {
              "title": "Planning Inputs & Variables",
              "type": "chart-metrics",
              "chart": { "value": 60, "label": "HS Coke" },
              "metrics": [
                { "label": "Min Stock", "value": "~8,000 t" },
                { "label": "Daily Cons.", "value": "~300 t/day" }
              ]
            },
            {
              "title": "Material Changeover Triggers",
              "type": "alert-list",
              "alerts": [
                { "title": "1. Quarterly Maintenance (Mar/Jun/Dec)", "desc": "Operational risk: 1-week downtime exceeding 5-day target. Impacts annual capacity gap.", "level": "orange" },
                { "title": "2. Startup / Warm-up", "desc": "2–3 hour heating requirement. Scrap during ~40-minute bypass.", "level": "orange" },
                { "title": "3. Kneader Breakdown (KN-201/202)", "desc": "Frequent downtime reduces throughput directly impacting 185k target.", "level": "red" },
                { "title": "4. Sulfur Classification Change", "desc": "Manual HS/LS identification creates decision latency.", "level": "slate" },
                { "title": "5. Changeover/Overhaul (multi-shift)", "desc": "Requires 4–5 shifts before normal speed is achieved.", "level": "slate" }
              ]
            }
          ]
        },
        {
          "title": "Process Steps & Control Points",
          "subsections": [
            {
              "title": "Detailed Manufacturing & CCPs",
              "type": "list-and-ccp",
              "listTitle": "Process Step Sequence",
              "steps": [
                "Receive coke & Store in silos (HS/LS)", "Screen coke & receive recycle streams",
                "Dose via feeders (CFW)", "Pre-heat blended mix",
                "Feed into kneader & Add pitch", "Monitor homogenization & Discharge paste",
                "Fill molds & compact", "Maintain temp (150-170°C)",
                "Transfer to cooling & Apply aging (~8h)", "Label manually & Dispatch to Baking"
              ],
              "ccps": [
                { 
                  "title": "CCP 1 — Kneader Mixing", 
                  "badge": "Moderate Control",
                  "layout": "full",
                  "details": [
                    { "label": "Control Variable", "value": "Ampere/KWh per ton" },
                    { "label": "Automation Layer", "value": "PLC INA-PLC-GRP-002" }
                  ],
                  "alert": { "label": "Risk", "value": "Throughput drop; shaft crack downtime." } 
                },
                { 
                  "title": "CCP 2 — Shaking/Forming", 
                  "badge": "Local Control",
                  "layout": "full",
                  "details": [
                    { "label": "Control Variable", "value": "Temp (~150–170°C); cycle (3m)" },
                    { "label": "Automation Layer", "value": "PLC INA-PLC-GRP-001" }
                  ],
                  "alert": { "label": "Risk", "value": "Green reject; compaction inconsistency." }
                },
                {
                  "title": "CCP 3 — Silo Level",
                  "layout": "half",
                  "details": [
                    { "label": "Var", "value": "% Level (sensor vs manual)" }
                  ],
                  "alert": { "label": "Risk", "value": "Supply disruption." }
                },
                {
                  "title": "CCP 4 — Mass Flow",
                  "layout": "half",
                  "details": [
                    { "label": "Var", "value": "Belt Load Cell" }
                  ],
                  "alert": { "label": "Risk", "value": "Dosing inconsistency." }
                }
              ]
            }
          ]
        },
        {
          "title": "Manufacturing Risk & Impact Assessment",
          "subsections": [
            {
              "type": "risk-grid",
              "risks": [
                { 
                  "title": "Theme 1 — Material Availability Risk", 
                  "attributes": [
                    { "label": "Observation", "value": "Shipment delays; HS stock depletion." },
                    { "label": "Business Impact", "value": "Annual capacity gap vs target.", "valueClass": "font-medium text-red-700" },
                    { "label": "Digital Implication", "value": "No integrated stock visibility." }
                  ] 
                },
                { 
                  "title": "Theme 2 — Kneader Reliability", 
                  "attributes": [
                    { "label": "Observation", "value": "Frequent breakdown; shaft crack." },
                    { "label": "Business Impact", "value": "Underperformance vs 185k capacity.", "valueClass": "font-medium text-red-700" },
                    { "label": "Digital Implication", "value": "No CBM analytics integrated." }
                  ] 
                },
                { 
                  "title": "Theme 3 — Measurement Inaccuracy", 
                  "attributes": [
                    { "label": "Observation", "value": "Silo level drift; 12% load cell deviation." },
                    { "label": "Business Impact", "value": "Scrap and instability risk.", "valueClass": "font-medium text-red-700" },
                    { "label": "Digital Implication", "value": "Instrument trust deficit." }
                  ] 
                },
                { 
                  "title": "Theme 4 — QA Data Latency", 
                  "attributes": [
                    { "label": "Observation", "value": "Manual QC; staged approval." },
                    { "label": "Business Impact", "value": "Quality exposure & delayed action.", "valueClass": "font-medium text-red-700" },
                    { "label": "Digital Implication", "value": "Lack of real-time data orchestration." }
                  ] 
                }
              ]
            }
          ]
        },
        {
          "title": "Assessment Conclusion",
          "subsections": [
            {
              "type": "conclusion",
              "headline": "Mechanically controlled but<br/><span class=\"text-report-500\">digitally fragmented.</span>",
              "paragraphs": [
                "The Green Plant manufacturing chain is structurally complete and technically defined, with clear material segregation and handling stages anchored by PLC-based control at critical nodes.",
                "However, the primary digital constraint lies in <strong class=\"text-white font-medium\">measurement reliability, silo accuracy, QA latency, and lack of integrated alarm logging</strong>."
              ],
              "footer": "Enhancement priority should focus on stabilizing measurement trust, improving data velocity, and reinforcing traceability depth — without altering the core mechanical chain."
            }
          ]
        },
        {
          "title": "Reference Map",
          "description": "Output 2B — Evidence Verification",
          "subsections": [
            {
              "type": "table",
              "headers": ["Section", "Evidence Source"],
              "rows": [
                ["Material Categories", "Process Elicitation Result; Findings; Equipment table"],
                ["Flow Architecture", "Process Groups; Process Elicitation"],
                ["Monitoring Table", "PLC; SCADA; Findings; File Used"],
                ["Charging Logic", "Findings; KPI definitions; Process Elicitation"],
                ["Manufacturing Steps", "Process Groups; Equipment; Elicitation"],
                ["CCP Identification", "PLC presence; Findings (scrap, downtime); KPI references"],
                ["Risk Themes", "Issue table; Findings"],
                ["Maturity Narrative", "PLC + SCADA tables; QA workflow; KPI definitions"]
              ]
            }
          ]
        }
      ]
    }
    </script>

    <script>
        const rawData = JSON.parse(document.getElementById('report-data').textContent);
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        report: {
                            50: rawData.theme.primaryLight,
                            100: '#d1fae5',
                            500: rawData.theme.primary,
                            800: rawData.theme.primaryDark,
                            900: rawData.theme.dark,
                        }
                    }
                }
            }
        };
    </script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .dark-glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hero-bg { background-image: linear-gradient(to right, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.7)), url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=2670&auto=format&fit=crop'); background-size: cover; background-position: center; }
        .table-container { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        .table-container::-webkit-scrollbar { height: 8px; }
        .table-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans leading-relaxed selection:bg-report-500 selection:text-white">

    <div id="app"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(document.getElementById('report-data').textContent);
            
            // --- Helper Components ---
            const renderHero = (meta) => `
                <section class="h-[80vh] flex flex-col justify-end p-8 md:p-16 lg:p-24 hero-bg text-white relative">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent mix-blend-multiply"></div>
                    <div class="relative z-10 max-w-5xl">
                        <div class="mb-6 inline-flex items-center px-4 py-1.5 rounded-full border border-report-500/50 bg-report-500/20 text-emerald-100 text-sm font-semibold tracking-wide uppercase shadow-lg">
                            ${meta.status}
                        </div>
                        <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-4 text-white drop-shadow-sm">
                            ${meta.title} <br/> <span class="text-report-500">Document</span>
                        </h1>
                        <h2 class="text-2xl md:text-3xl font-light text-slate-300 mb-12 max-w-3xl leading-snug">
                            ${meta.subtitle}
                        </h2>
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 border-t border-white/20 pt-8 mt-12 dark-glass rounded-3xl p-8 shadow-2xl backdrop-blur-xl items-center">
                            ${meta.attributes.map(attr => `
                                <div>
                                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">${attr.label}</p>
                                    <p class="text-lg ${attr.valueClass || 'font-medium text-white'}">${attr.value}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;

            const renderSubHeading = (sub) => {
                if(!sub.title) return '';
                return `
                    <div class="mb-6">
                        <h3 class="text-2xl font-bold text-slate-800 tracking-tight flex items-center gap-3">
                            ${sub.title}
                        </h3>
                    </div>
                `;
            };

            // --- Block Renderers based on Sub-section "type" ---
            const renderBlocks = {
                "narrative": (sub) => `
                    <div class="max-w-4xl space-y-6 text-xl font-light text-slate-700">
                        ${sub.paragraphs.map(p => `<p class="leading-relaxed">${p}</p>`).join('')}
                        ${sub.takeaway ? `
                        <blockquote class="bg-slate-900 rounded-[2.5rem] p-10 text-white shadow-xl relative overflow-hidden transform mt-10">
                            <div class="absolute left-0 top-0 bottom-0 w-2.5 bg-gradient-to-b from-emerald-400 to-report-500"></div>
                            <p class="relative z-10 text-xl font-light leading-relaxed">${sub.takeaway}</p>
                        </blockquote>` : ''}
                    </div>
                `,
                "card-grid": (sub) => `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${sub.cards.map(cat => `
                            <div class="glass-card rounded-3xl p-8 shadow-sm border border-slate-200/60 relative overflow-hidden group">
                                <div class="absolute top-0 right-0 w-24 h-24 bg-${cat.theme}-50 rounded-bl-full -z-10 group-hover:scale-110 transition-transform"></div>
                                <h4 class="text-xl font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">${cat.title}</h4>
                                <ul class="space-y-2 text-sm text-slate-600 list-disc pl-4">${cat.items.map(i => `<li>${i}</li>`).join('')}</ul>
                            </div>
                        `).join('')}
                    </div>
                `,
                "flow-stepper": (sub) => `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                        <div class="bg-white rounded-[2rem] p-8 md:p-12 shadow-sm border border-slate-200">
                            <h4 class="text-lg font-bold text-slate-800 mb-6 border-b border-slate-100 pb-3">${sub.flowTitle}</h4>
                            <div class="space-y-4">
                                ${sub.stages.map((stage, idx) => `
                                    <div class="flex items-center gap-4">
                                        <div class="w-8 h-8 rounded-full ${stage.highlight ? 'bg-report-50 text-report-600 border border-report-100' : 'bg-slate-100 text-slate-600'} flex items-center justify-center font-bold text-sm shrink-0">${idx + 1}</div>
                                        <p class="${stage.highlight ? 'text-slate-900 font-bold' : 'text-slate-700 font-medium'}">${stage.name}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="flex flex-col gap-6">
                            ${sub.summaryBoxes.map(box => `
                                <div class="${box.theme === 'dark' ? 'bg-[#0f172a] text-slate-300 border-slate-800 shadow-xl' : 'bg-blue-50 text-blue-800 border-blue-100 shadow-sm'} rounded-[2rem] p-8 border">
                                    <h4 class="${box.theme === 'dark' ? 'text-slate-400 uppercase tracking-widest text-sm' : 'text-blue-900 text-lg'} font-bold mb-3">${box.title}</h4>
                                    <p class="leading-relaxed ${box.theme === 'dark' ? 'font-mono text-sm' : ''}">${box.content}</p>
                                </div>
                            `).join('')}
                            <div class="bg-white border border-slate-200 rounded-[2rem] p-8 shadow-sm flex-grow">
                                <h4 class="text-slate-800 font-bold text-lg mb-4">${sub.bulletBox.title}</h4>
                                <ul class="space-y-3">
                                    ${sub.bulletBox.items.map(item => `<li class="flex items-center gap-3"><span class="w-2 h-2 rounded-full bg-report-500"></span><span class="text-slate-700 font-medium">${item}</span></li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                `,
                "table": (sub) => `
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden table-container overflow-x-auto">
                        <table class="w-full text-left min-w-[800px] border-collapse">
                            <thead>
                                <tr class="bg-slate-900 text-white uppercase text-xs tracking-wider">
                                    ${sub.headers.map((h, i) => `<th class="p-4 font-semibold ${i===0?'rounded-tl-3xl':''}">${h}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody class="text-slate-700 text-sm divide-y divide-slate-100">
                                ${sub.rows.map(row => `
                                    <tr class="hover:bg-slate-50">
                                        ${row.map((cell, i) => `<td class="p-4 ${i===0?'font-medium text-slate-900':''}">${cell}</td>`).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `,
                "split-cards": (sub) => {
                    const renderHalf = (card) => `
                        <div class="bg-${card.theme === 'report' ? 'report' : card.theme}-50 border border-${card.theme === 'report' ? 'report' : card.theme}-200 rounded-3xl p-8 shadow-sm">
                            <h4 class="text-xl font-bold text-${card.theme === 'report' ? 'report' : card.theme}-800 mb-6">${card.title}</h4>
                            <ul class="space-y-3 text-${card.theme === 'report' ? 'report' : card.theme}-900 list-disc pl-5">${card.items.map(i => `<li>${i}</li>`).join('')}</ul>
                        </div>
                    `;
                    return `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            ${renderHalf(sub.leftCard)}
                            ${renderHalf(sub.rightCard)}
                        </div>
                        ${sub.conclusion ? `<div class="mt-8 text-center bg-slate-100 py-3 px-6 rounded-full border border-slate-200 inline-block">Overall Status: <strong class="text-slate-900">${sub.conclusion}</strong></div>` : ''}
                    `;
                },
                "chart-metrics": (sub) => `
                    <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-200 flex flex-col md:flex-row items-center gap-12">
                        <div class="relative w-48 h-48 flex-shrink-0">
                            <svg viewBox="0 0 36 36" class="w-full h-full">
                                <path class="text-slate-100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="6"/>
                                <path class="text-report-500" stroke-dasharray="${sub.chart.value}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="6"/>
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-3xl font-black text-slate-800">${sub.chart.value}%</span><span class="text-xs font-bold text-slate-500 uppercase">${sub.chart.label}</span>
                            </div>
                        </div>
                        <div class="flex-grow grid grid-cols-2 gap-4">
                            ${sub.metrics.map(m => `
                                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">${m.label}</p>
                                    <p class="font-bold text-slate-800 text-2xl">${m.value}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `,
                "alert-list": (sub) => `
                    <div class="space-y-4">
                        ${sub.alerts.map(a => `
                            <div class="bg-${a.level==='slate'?'slate':a.level}-50 border-l-4 border-${a.level==='slate'?'slate-400':a.level+'-500'} p-5 rounded-r-2xl ${a.level === 'red' ? 'shadow-sm' : ''}">
                                <h4 class="font-bold text-${a.level==='slate'?'slate-800':a.level+'-900'}">${a.title}</h4>
                                <p class="text-sm text-${a.level==='slate'?'slate-600':a.level+'-800'} mt-1 ${a.level === 'red' ? 'font-medium' : ''}">${a.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                `,
                "list-and-ccp": (sub) => {
                    const fullCCPs = sub.ccps.filter(c => c.layout === 'full');
                    const halfCCPs = sub.ccps.filter(c => c.layout === 'half');
                    
                    return `
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                        <div class="lg:col-span-5 bg-white rounded-[2rem] p-8 shadow-sm border border-slate-200 h-fit">
                            <h4 class="text-lg font-bold text-slate-800 mb-6 pb-4 border-b border-slate-100">${sub.listTitle}</h4>
                            <ol class="grid grid-cols-1 gap-y-3 list-decimal pl-6 text-sm text-slate-700 font-medium marker:text-report-500 marker:font-bold">
                                ${sub.steps.map(step => `<li>${step}</li>`).join('')}
                            </ol>
                        </div>
                        <div class="lg:col-span-7 flex flex-col gap-6">
                            ${fullCCPs.map(ccp => `
                                <div class="bg-white rounded-2xl p-6 shadow-sm border-l-[6px] border-report-500 border border-slate-200 hover:-translate-y-1 transition-transform cursor-default">
                                    <div class="flex justify-between items-start mb-2">
                                        <h4 class="text-lg font-bold text-slate-900">${ccp.title}</h4>
                                        <span class="bg-slate-100 text-slate-600 px-3 py-1 rounded text-xs font-bold">${ccp.badge}</span>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4 text-sm mt-4">
                                        ${ccp.details.map(d => `
                                            <div><p class="text-slate-400 text-[10px] uppercase font-bold tracking-wider">${d.label}</p><p class="font-medium text-slate-800">${d.value}</p></div>
                                        `).join('')}
                                        ${ccp.alert ? `<div class="col-span-2 bg-red-50 p-3 rounded-lg"><p class="text-red-800 font-medium"><span class="font-bold uppercase text-[10px] tracking-wider block mb-1">${ccp.alert.label}</span>${ccp.alert.value}</p></div>` : ''}
                                    </div>
                                </div>
                            `).join('')}
                            
                            ${halfCCPs.length > 0 ? `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    ${halfCCPs.map(ccp => `
                                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5">
                                            <h4 class="font-bold text-slate-800 mb-2">${ccp.title}</h4>
                                            ${ccp.details.map(d => `
                                                <p class="text-sm text-slate-600"><strong class="text-slate-900">${d.label}:</strong> ${d.value}</p>
                                            `).join('')}
                                            ${ccp.alert ? `<p class="text-xs text-red-600 font-medium mt-2">${ccp.alert.label}: ${ccp.alert.value}</p>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    `;
                },
                "risk-grid": (sub) => `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        ${sub.risks.map(r => `
                            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                                <h4 class="text-xl font-bold text-slate-900 mb-4 border-b border-slate-100 pb-3">${r.title}</h4>
                                <div class="space-y-3 text-sm">
                                    ${r.attributes.map(attr => `
                                        <p><span class="text-slate-500 uppercase font-bold text-[10px] tracking-widest block">${attr.label}</span> <span class="${attr.valueClass || 'text-slate-700'}">${attr.value}</span></p>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `,
                "conclusion": (sub) => `
                    <div class="bg-[#0f172a] rounded-[3rem] p-12 md:p-20 text-white shadow-2xl relative overflow-hidden text-center">
                        <div class="absolute inset-0 bg-report-900 opacity-50 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-report-800/20 via-transparent to-transparent"></div>
                        <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-10 relative z-10 leading-tight">${sub.headline}</h2>
                        <div class="max-w-4xl mx-auto space-y-6 text-slate-300 text-lg md:text-xl font-light leading-relaxed relative z-10">
                            ${sub.paragraphs.map(p => `<p>${p}</p>`).join('')}
                            ${sub.footer ? `<div class="mt-8 pt-8 border-t border-slate-700"><p class="font-medium text-report-400">${sub.footer}</p></div>` : ''}
                        </div>
                    </div>
                `
            };

            // --- Main Builder Loop ---
            let reportHTML = renderHero(data.metadata);
            reportHTML += `<main class="max-w-[1440px] mx-auto px-6 md:px-12 py-24 flex flex-col gap-24">`;

            // Loop Top-Level Sections
            data.sections.forEach((section, index) => {
                const secNum = String(index + 1).padStart(2, '0');
                reportHTML += `
                    <div class="w-full border-t border-slate-200 pt-16 first:border-0 first:pt-0">
                        <!-- Section Header -->
                        <div class="flex items-stretch gap-4 mb-12">
                            <div class="w-1.5 bg-slate-900 rounded-full"></div>
                            <div class="py-1">
                                <p class="text-report-500 font-bold tracking-widest uppercase text-xs mb-1">Section ${secNum}</p>
                                <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">${section.title}</h2>
                                ${section.description ? `<p class="text-sm text-slate-500 mt-2">${section.description}</p>` : ''}
                            </div>
                        </div>
                        
                        <!-- Loop Sub-sections -->
                        <div class="w-full space-y-16">
                            ${section.subsections.map(sub => `
                                <div class="w-full">
                                    ${renderSubHeading(sub)}
                                    ${renderBlocks[sub.type] ? renderBlocks[sub.type](sub) : `<p class="text-red-500">Unknown block type: ${sub.type}</p>`}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            reportHTML += `</main>`;
            app.innerHTML = reportHTML;
        });
    </script>
</body>
</html>
