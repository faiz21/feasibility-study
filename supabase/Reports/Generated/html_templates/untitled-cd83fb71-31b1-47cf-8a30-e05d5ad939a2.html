<body class="bg-slate-50 text-slate-800 font-sans leading-relaxed selection:bg-report-500 selection:text-white">

    <div id="app"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(document.getElementById('report-data').textContent);
            const app = document.getElementById('app');

            // Render section header component (Numbered UI removed entirely per request)
            const renderSectionTitle = (titleText, subtitleText = '') => `
                <div class="flex items-stretch gap-4 mb-10">
                    <div class="w-2 bg-report-500 rounded-full"></div>
                    <div class="py-1">
                        <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">${titleText}</h2>
                        ${subtitleText ? `<p class="text-base text-slate-500 mt-2 font-medium">${subtitleText}</p>` : ''}
                    </div>
                </div>
            `;

            // Status Badge Helpers
            const getCoverageBadge = (status) => {
                if(status === 'Connected') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                if(status.includes('To validate') || status === 'Limited') return 'bg-yellow-50 text-yellow-700 border-yellow-200';
                return 'bg-slate-100 text-slate-600 border-slate-200';
            };
            
            const getRiskBadge = (exposure) => {
                const map = {
                    'High': 'bg-red-50 text-red-700 border-red-200',
                    'Medium': 'bg-orange-50 text-orange-700 border-orange-200',
                    'To validate': 'bg-slate-100 text-slate-600 border-slate-300'
                };
                return map[exposure] || 'bg-slate-50 text-slate-700 border-slate-200';
            };

            const renderDoughnutChart = (chart) => {
                let currentPct = 0;
                const gradientString = chart.chart.map(item => {
                    const pct = (item.value / chart.total) * 100;
                    const str = `${item.color} ${currentPct}% ${currentPct + pct}%`;
                    currentPct += pct;
                    return str;
                }).join(', ');

                return `
                    <div class="flex flex-col xl:flex-row items-center justify-center gap-8 w-full p-8 bg-white rounded-3xl border border-slate-200 shadow-sm h-full">
                        <div class="relative w-40 h-40 flex-shrink-0">
                            <div class="absolute inset-0 rounded-full" style="background: conic-gradient(${gradientString})"></div>
                            <div class="absolute inset-4 bg-white rounded-full flex items-center justify-center shadow-inner">
                                <div class="text-center">
                                    <span class="block text-2xl font-black text-slate-800">${chart.total}</span>
                                    <span class="block text-[10px] uppercase font-bold text-slate-400">Systems</span>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-4 w-full">
                            ${chart.chart.map(item => `
                                <div class="flex items-start gap-3">
                                    <div class="w-4 h-4 rounded-full mt-0.5 shadow-sm shrink-0" style="background-color: ${item.color}"></div>
                                    <div>
                                        <p class="font-bold text-slate-800 leading-none">${item.label} <span class="text-slate-500 font-medium ml-1">(${item.value})</span></p>
                                        <p class="text-xs text-slate-500 mt-1">${item.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            };

            const html = `
                <!-- COVER COMPONENT -->

                            ${data.metadata.documentId}
                        </div>
                        <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-4 text-white drop-shadow-sm">

                            ${data.metadata.subtitle}
                        </h2>

                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Facility</p>
                                <p class="font-medium text-white text-lg">${data.metadata.plant}</p>

                            <div>

                        <p class="text-slate-700 leading-relaxed">

                                Key References & Linkages

                        <p class="text-slate-500 italic text-base border-l-4 border-slate-300 pl-4 py-1">

                    <!-- SECTION: LANDSCAPE SNAPSHOT -->
                    <div class="col-span-1 md:col-span-12 mt-8 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.landscapeSnapshot.title)}
                        
                        <!-- Metrics Grid -->
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mb-12">
                            ${data.sections.landscapeSnapshot.metrics.map(m => `
                                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-center items-center text-center hover:border-report-500 transition-colors">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">${m.label}</p>

                                </div>

                                    <thead>
                                        <tr class="text-slate-400 uppercase text-xs tracking-wider border-b border-slate-100">

                                        </tr>
                                    </thead>
                                    <tbody class="text-sm divide-y divide-slate-100">
                                        ${data.sections.landscapeSnapshot.lifecycle.implications.map(imp => `
                                            <tr class="hover:bg-slate-50 transition-colors">
                                                <td class="py-4 font-medium text-slate-800 whitespace-nowrap">${imp.band}</td>
                                                <td class="py-4 text-center font-bold ${imp.count > 0 ? 'text-report-500' : 'text-slate-400'}">${imp.count}</td>

                                            </tr>
                                        `).join('')}
                                    </tbody>

                    <!-- SECTION: INVENTORY REGISTER -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">

                                                </li>
                                                <li class="flex items-start gap-3 text-sm text-slate-700">
                                                    <div class="mt-0.5 shrink-0 w-5 h-5 rounded flex items-center justify-center bg-slate-100 text-slate-500"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></div>
                                                    <span><strong class="font-semibold text-slate-900">Visibility:</strong> ${scada.risk.visibility}</span>
                                                </li>
                                                <li class="flex items-start gap-3 text-sm text-slate-700">
                                                    <div class="mt-0.5 shrink-0 w-5 h-5 rounded flex items-center justify-center bg-red-50 text-red-500"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></div>
                                                    <span><strong class="font-semibold text-slate-900">Governance:</strong> ${scada.risk.governance}</span>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- SECTION: COVERAGE VS PROCESS GROUPS -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.coverageVsProcessGroups.title)}
                        
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden table-container overflow-x-auto">
                            <table class="w-full text-left min-w-[800px] border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wider border-b border-slate-200">
                                        <th class="p-5 font-bold">Process Group</th>
                                        <th class="p-5 font-bold">Coverage Status</th>
                                        <th class="p-5 font-bold">Basis</th>
                                        <th class="p-5 font-bold">Notes</th>
                                    </tr>
                                </thead>
                                <tbody class="text-slate-800 text-sm divide-y divide-slate-100">
                                    ${data.sections.coverageVsProcessGroups.items.map(row => `
                                        <tr class="hover:bg-slate-50 transition-colors">
                                            <td class="p-5 font-mono font-medium text-slate-900">${row.pg}</td>
                                            <td class="p-5">
                                                <span class="px-3 py-1 rounded-full text-xs font-bold border ${getCoverageBadge(row.status)}">
                                                    ${row.status}
                                                </span>
                                            </td>
                                            <td class="p-5 text-slate-600">${row.basis}</td>
                                            <td class="p-5 text-slate-600 italic">${row.notes}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        <p class="text-xs text-slate-400 mt-4 px-4 uppercase tracking-widest font-bold">${data.sections.coverageVsProcessGroups.note}</p>
                    </div>

                    <!-- SECTION: ARCHITECTURAL OBSERVATIONS -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.architecturalObservations.title)}

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
                            ${data.sections.architecturalObservations.items.map(obs => `
                                <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm hover:shadow-lg transition-shadow group relative overflow-hidden">
                                    <div class="absolute top-0 left-0 w-1.5 h-full bg-slate-200 group-hover:bg-report-500 transition-colors"></div>
                                    <h3 class="text-xl font-bold text-slate-800 mb-6 pl-4">${obs.title}</h3>
                                    <div class="space-y-4 pl-4">
                                        <div>
                                            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Observation Trigger</p>
                                            <p class="text-sm font-medium text-slate-700">${obs.trigger}</p>
                                        </div>
                                        <div>
                                            <p class="text-[10px] font-bold uppercase tracking-widest text-report-500 mb-1">Operational Effect</p>
                                            <p class="text-sm text-slate-600">${obs.effect}</p>
                                        </div>
                                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mt-2">
                                            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-800 mb-1">Governance Implication</p>
                                            <p class="text-sm text-slate-700 italic">${obs.governance}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Summary Block -->
                        <div class="bg-indigo-50/50 rounded-2xl p-6 md:p-8 border border-indigo-100 text-lg font-light text-indigo-900 text-center max-w-5xl mx-auto leading-relaxed">
                            <strong class="font-bold block mb-2 uppercase text-xs tracking-widest text-report-500">${data.sections.architecturalObservations.summary.title}</strong>
                            ${data.sections.architecturalObservations.summary.text}
                        </div>
                    </div>

                    <!-- SECTION: MATURITY ASSESSMENT -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.maturityAssessment.title, data.sections.maturityAssessment.subtitle)}
                        
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="bg-slate-900 text-white uppercase text-xs tracking-wider">
                                        <th class="p-5 font-semibold">Dimension</th>
                                        <th class="p-5 font-semibold">Current Posture</th>
                                        <th class="p-5 font-semibold">Exposure Level</th>
                                        <th class="p-5 font-semibold">Evidence Anchor</th>
                                    </tr>
                                </thead>
                                <tbody class="text-slate-800 text-sm divide-y divide-slate-100">
                                    ${data.sections.maturityAssessment.items.map(m => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-5 font-bold text-slate-700">${m.dimension}</td>
                                            <td class="p-5 font-medium">${m.posture}</td>
                                            <td class="p-5">
                                                <span class="px-3 py-1 rounded-full text-xs font-bold border ${getRiskBadge(m.exposure)}">
                                                    ${m.exposure}
                                                </span>
                                            </td>
                                            <td class="p-5 text-slate-600 italic text-xs">${m.anchor}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- SECTION: EXECUTIVE FRAMING & REFERENCE MAP -->
                    <div class="col-span-1 md:col-span-12 flex flex-col gap-16 mt-12 border-t border-slate-200 pt-16 mb-24">
                        
                        <!-- Executive Framing -->
                        <div class="bg-report-roadmapBg rounded-[3rem] p-10 md:p-16 text-white shadow-2xl relative overflow-hidden">
                            <div class="absolute right-0 bottom-0 w-64 h-64 bg-report-500/20 rounded-full blur-3xl translate-x-1/3 translate-y-1/3"></div>
                            <div class="absolute left-0 top-0 w-64 h-64 bg-report-accent/10 rounded-full blur-3xl -translate-x-1/3 -translate-y-1/3"></div>
                            
                            <div class="relative z-10 mb-10">
                                <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight">${data.sections.executiveFraming.title}</h2>
                            </div>
                            
                            <ul class="space-y-6 relative z-10 max-w-4xl text-lg font-light text-slate-200">
                                ${data.sections.executiveFraming.items.map(point => `
                                    <li class="flex items-start gap-5">
                                        <span class="w-8 h-8 rounded-full bg-report-500/20 border border-report-500 flex items-center justify-center shrink-0 mt-0.5 shadow-[0_0_12px_rgba(79,70,229,0.5)]">
                                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                        </span>
                                        <p class="leading-relaxed">${point}</p>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <!-- Reference Map -->
                        <div class="w-full">
                            ${renderSectionTitle(data.sections.referenceMap.title, data.sections.referenceMap.subtitle)}
                            
                            <div class="bg-white rounded-[2rem] p-6 md:p-8 overflow-hidden shadow-sm border border-slate-200">
                                <table class="w-full text-left">
                                    <thead>
                                        <tr class="text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-100">
                                            <th class="p-3 pb-4 font-bold">Section</th>
                                            <th class="p-3 pb-4 font-bold">Evidence Source</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-slate-700 text-sm divide-y divide-slate-50">
                                        ${data.sections.referenceMap.items.map(ref => `
                                            <tr class="hover:bg-slate-50 transition-colors">
                                                <td class="p-3 py-4 font-bold text-slate-800 whitespace-nowrap">${ref.section}</td>
                                                <td class="p-3 py-4 font-mono text-xs text-report-500">${ref.source}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            <p class="text-xs text-slate-400 mt-4 px-4 text-center uppercase tracking-widest font-bold">${data.sections.referenceMap.footer}</p>
                        </div>

                    </div>
                </main>
            `;
            
            app.innerHTML = html;
        });
    </script>
