                                            <td class="p-5 font-mono font-medium text-slate-900">${row.col1}</td>
                                            <td class="p-5 text-slate-500">${row.col2}</td>
                                            <td class="p-5 font-bold text-slate-800">${row.col3}</td>
                                            <td class="p-5">
                                                <span class="font-mono text-xs text-report-800 bg-report-50 border border-report-100 px-2 py-1 rounded shadow-sm">${row.col4}</span>
                                            </td>
                                            <td class="p-5">
                                                <span class="px-3 py-1.5 border rounded-lg text-xs font-bold shadow-sm ${getBadgeStyle(row.col5)}">${row.col5}</span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                            <div class="p-5 bg-slate-50 text-center border-t border-slate-200 text-sm text-slate-500 italic">
                                *${data.sections.s3_inventory.note}*
                            </div>
                        </div>
                    </div>

                    <!-- SECTION 4: OBSERVATIONS -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.s4_observations.title, data.sections.s4_observations.subtitle)}
                        
                        <!-- Density & Exposure (Stacked Horizontal) -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
                            <!-- Density Pattern -->
                            <div class="bg-white rounded-[2rem] p-8 border border-slate-200 shadow-sm">
                                <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-report-50 flex items-center justify-center">
                                        <svg class="w-4 h-4 text-report-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                    </div>
                                    ${data.sections.s4_observations.density.title}
                                </h3>
                                <div class="flex flex-wrap gap-2 mb-6">
                                    ${data.sections.s4_observations.density.points.map(p => `<span class="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-semibold">${p}</span>`).join('')}
                                </div>
                                <p class="text-sm text-slate-600 leading-relaxed">${data.sections.s4_observations.density.conclusion}</p>
                            </div>

                            <!-- Automation Exposure -->
                            <div class="bg-white rounded-[2rem] p-8 border border-slate-200 shadow-sm">
                                <h3 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-report-50 flex items-center justify-center">
                                        <svg class="w-4 h-4 text-report-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                                    </div>
                                    ${data.sections.s4_observations.automation.title}
                                </h3>
                                <div class="space-y-3 mb-6">
                                    ${data.sections.s4_observations.automation.categories.map(cat => `
                                        <div class="flex items-start gap-4">
                                            <span class="text-xs font-bold text-slate-400 uppercase w-20 shrink-0 mt-0.5">${cat.label}</span>
                                            <p class="text-sm text-slate-700 font-medium">${cat.values.join(', ')}</p>
                                        </div>
                                    `).join('')}
                                </div>
                                <p class="text-sm text-slate-600 leading-relaxed border-t border-slate-100 pt-4">${data.sections.s4_observations.automation.pattern}</p>
                            </div>
                        </div>

                        <!-- Bottleneck Cards Grid -->
                        <h3 class="text-2xl font-bold text-slate-800 mb-8 tracking-tight">${data.sections.s4_observations.bottlenecks.title}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            ${data.sections.s4_observations.bottlenecks.items.map(b => `
                                <div class="bg-white rounded-[2rem] p-8 shadow-md border border-slate-200 hover:shadow-xl transition-shadow relative overflow-hidden group">
                                    <div class="absolute top-0 right-0 w-32 h-32 bg-report-accent/10 rounded-bl-full -z-0 transition-transform group-hover:scale-110"></div>
                                    <h4 class="text-xl font-bold text-slate-800 mb-6 relative z-10 pr-12">${b.equipment}</h4>
                                    <div class="space-y-5 relative z-10">
                                        <div>
                                            <p class="text-[10px] uppercase font-bold text-slate-400 tracking-widest mb-1.5">Observation</p>
                                            <p class="text-slate-700 text-sm leading-relaxed">${b.observation}</p>
                                        </div>
                                        <div>
                                            <p class="text-[10px] uppercase font-bold text-report-accent tracking-widest mb-1.5">Operational Effect</p>
                                            <p class="text-amber-900 text-sm bg-amber-50 p-3 rounded-xl border border-amber-100 leading-relaxed">${b.effect}</p>
                                        </div>
                                        <div>
                                            <p class="text-[10px] uppercase font-bold text-report-500 tracking-widest mb-1.5">Digital Implication</p>
                                            <p class="text-slate-700 text-sm border-l-2 border-report-200 pl-4 py-1 leading-relaxed">${b.implication}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- SECTION 5: GOVERNANCE READINESS -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.s5_governance.title)}

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${data.sections.s5_governance.items.map(item => `
                                <div class="flex items-start gap-5 bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                    <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center shrink-0 border border-slate-100 mt-0.5 shadow-inner">
                                        ${getGovernanceIcon(item.status)}
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-lg mb-2">${item.title}</h4>
                                        <p class="text-slate-600 text-sm leading-relaxed">${item.description}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- SECTION 6: REFERENCE MAP -->
                    <div class="col-span-1 md:col-span-12 mt-16 mb-24">
                        ${renderSectionTitle(data.sections.s6_referenceMap.title, data.sections.s6_referenceMap.subtitle)}
                        
                        <div class="bg-report-900 rounded-[2.5rem] p-6 md:p-10 overflow-hidden shadow-2xl border border-slate-800">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-700">
                                        ${data.sections.s6_referenceMap.columns.map((col, index) => `
                                            <th class="p-4 pb-6 font-bold ${index === 0 ? 'w-1/3' : ''}">${col}</th>
                                        `).join('')}
                                    </tr>
                                </thead>
                                <tbody class="text-slate-300 text-sm divide-y divide-slate-800/60">
                                    ${data.sections.s6_referenceMap.rows.map(row => `
                                        <tr class="hover:bg-slate-800/50 transition-colors">
                                            <td class="p-4 py-5 font-bold text-white">${row.col1}</td>
                                            <td class="p-4 py-5 leading-relaxed text-slate-400">${row.col2}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                </main>
            `;
            
            app.innerHTML = html;
        });
    </script>
</body>
</html>
