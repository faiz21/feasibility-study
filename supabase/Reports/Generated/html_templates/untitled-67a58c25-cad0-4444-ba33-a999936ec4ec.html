<body class="bg-slate-50 text-slate-800 font-sans leading-relaxed selection:bg-report-500 selection:text-white">

    <div id="app"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(document.getElementById('report-data').textContent);
            const app = document.getElementById('app');

            // Dynamic section title builder
            const renderSectionTitle = (sectionNumber, titleText, subtitleText = '') => `
                <div class="flex items-stretch gap-4 mb-8">
                    <div class="w-1.5 bg-[#0f172a] rounded-full"></div>
                    <div class="py-1">
                        <p class="text-report-500 font-bold tracking-widest uppercase text-xs mb-1">${sectionNumber}</p>
                        <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">${titleText}</h2>
                        ${subtitleText ? `<p class="text-sm text-slate-500 mt-2">${subtitleText}</p>` : ''}
                    </div>
                </div>
            `;

            // Generic styling helpers based on textual matching
            const getRelevanceBadge = (relevance) => {
                if (!relevance) return 'bg-slate-100 text-slate-600 border-slate-300';
                const normalized = relevance.toLowerCase();
                if(normalized.includes('core')) return 'bg-purple-100 text-purple-700 border-purple-200';
                if(normalized.includes('critical')) return 'bg-red-50 text-red-700 border-red-200';
                if(normalized.includes('high')) return 'bg-orange-50 text-orange-700 border-orange-200';
                if(normalized.includes('moderate')) return 'bg-blue-50 text-blue-700 border-blue-200';
                return 'bg-slate-100 text-slate-600 border-slate-300';
            };

            const getMaturityBadge = (score) => {
                if (!score) return 'bg-slate-100 text-slate-600 border-slate-300';
                const normalized = score.toLowerCase();
                if(normalized.includes('low')) return 'bg-red-50 text-red-700 border-red-200';
                if(normalized.includes('medium')) return 'bg-orange-50 text-orange-700 border-orange-200';
                return 'bg-emerald-50 text-emerald-700 border-emerald-200';
            };

            const html = `
                <!-- COVER COMPONENT -->
                <section class="h-[95vh] flex flex-col justify-end p-8 md:p-16 lg:p-24 hero-bg text-white relative">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent mix-blend-multiply"></div>
                    <div class="relative z-10 max-w-5xl">
                        <div class="mb-6 inline-flex items-center px-4 py-1.5 rounded-full border border-report-500/50 bg-report-500/20 text-emerald-100 text-sm font-semibold tracking-wide uppercase shadow-lg">
                            ${data.metadata.documentId}
                        </div>
                        <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-4 text-white drop-shadow-sm">
                            ${data.metadata.title.split('-')[0] || data.metadata.title} <br/> 
                            <span class="text-report-500">${data.metadata.title.split('-')[1] || ''}</span>
                        </h1>
                        <h2 class="text-2xl md:text-3xl font-light text-slate-300 mb-12 max-w-3xl leading-snug">
                            ${data.metadata.subtitle}
                        </h2>

                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 border-t border-white/20 pt-8 mt-12 dark-glass rounded-3xl p-8 shadow-2xl backdrop-blur-xl items-center">
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Facility</p>
                                <p class="font-medium text-white text-lg">${data.metadata.plant}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Company</p>
                                <p class="font-medium text-white text-lg">${data.metadata.company}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Issue Date</p>
                                <p class="font-medium text-white text-lg">${data.metadata.date}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Status</p>
                                <p class="font-medium text-report-500 flex items-center gap-2 text-lg">
                                    <span class="w-2.5 h-2.5 rounded-full bg-report-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
                                    ${data.metadata.status}
                                </p>
                            </div>
                        </div>
                    </div>
                </section>

                <main class="max-w-[1440px] mx-auto px-6 md:px-12 py-24 grid grid-cols-1 md:grid-cols-12 gap-y-20 gap-x-8">

                    <!-- DYNAMIC SECTION: PURPOSE -->
                    <div class="col-span-1 md:col-span-12">
                        ${renderSectionTitle(data.sections.purpose.sectionTitle, data.sections.purpose.titleText, data.sections.purpose.subtitleText)}
                    </div>

                    <div class="col-span-1 md:col-span-8 md:col-start-3 space-y-8 text-xl font-light">
                        <p class="text-slate-700 leading-relaxed">
                            ${data.sections.purpose.content}
                        </p>
                        <blockquote class="bg-slate-900 rounded-[2rem] p-8 text-white shadow-xl relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-2 bg-gradient-to-b from-emerald-400 to-report-500"></div>
                            <p class="relative z-10 text-lg font-light leading-relaxed">
                                ${data.sections.purpose.takeaway}
                            </p>
                        </blockquote>
                    </div>
                    
                    <!-- DYNAMIC SECTION: SNAPSHOT METRICS -->
                    <div class="col-span-1 md:col-span-12 mt-8 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.snapshot.sectionTitle, data.sections.snapshot.titleText, data.sections.snapshot.subtitleText)}
                        
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mt-8">
                            ${data.sections.snapshot.metrics.map(m => {
                                // Default styling for general numeric cards (Emerald themed)
                                let cardClass = "bg-[#f0fdf4] border-[#bbf7d0]";
                                let textClass = "text-[#15803d]";
                                let labelClass = "text-[#4ade80]";
                                let subtextClass = "text-slate-500";
                                
                                // Conditional styling matching the exact reference image tones
                                if (m.value === 'Critical') {
                                    cardClass = "bg-[#fef2f2] border-[#fecaca]"; // light red bg, soft red border
                                    textClass = "text-[#b91c1c]"; // dark red text
                                    labelClass = "text-[#f87171]"; // medium red label
                                    subtextClass = "text-[#64748b]"; // slightly darker subtext for contrast
                                } else if (m.value === 'High') {
                                    cardClass = "bg-[#fff7ed] border-[#fed7aa]"; // light orange bg, soft orange border
                                    textClass = "text-[#c2410c]"; // dark orange text
                                    labelClass = "text-[#fb923c]"; // medium orange label
                                    subtextClass = "text-[#64748b]"; 
                                } else if (m.value === 'Fragmented') {
                                    cardClass = "bg-[#f8fafc] border-[#e2e8f0]"; // light slate bg, soft slate border
                                    textClass = "text-[#334155]"; // dark slate text
                                    labelClass = "text-[#94a3b8]"; // medium slate label
                                    subtextClass = "text-[#64748b]"; 
                                }

                                return `
                                    <div class="rounded-[24px] p-6 md:py-8 border-[1.5px] flex flex-col justify-center items-center text-center shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 ${cardClass}">
                                        <p class="text-[11px] font-bold uppercase tracking-[0.15em] mb-3 ${labelClass}">${m.label}</p>
                                        <p class="text-4xl font-extrabold mb-3 tracking-tight ${textClass}">${m.value}</p>
                                        <p class="text-xs font-medium leading-relaxed px-1 ${subtextClass}">${m.subtext}</p>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- DYNAMIC SECTION: INVENTORY REGISTER & COMMENTARY -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.inventory.sectionTitle, data.sections.inventory.titleText, data.sections.inventory.subtitleText)}
                        
                        <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden table-container overflow-x-auto mb-16">
                            <table class="w-full text-left min-w-[800px] border-collapse">
                                <thead>
                                    <tr class="bg-slate-900 text-white uppercase text-xs tracking-wider">
                                        ${data.sections.inventory.tableHeaders.map((header, index) => `
                                            <th class="p-4 font-semibold ${index === 0 ? 'rounded-tl-3xl' : ''}">${header}</th>
                                        `).join('')}
                                    </tr>
                                </thead>
                                <tbody class="text-slate-700 text-sm divide-y divide-slate-100">
                                    ${data.sections.inventory.tableData.map(row => `
                                        <tr class="hover:bg-slate-50 transition-colors">
                                            <td class="p-4 font-mono font-medium text-slate-900">${row.code}</td>
                                            <td class="p-4 font-bold text-slate-800 whitespace-nowrap">${row.name}</td>
                                            <td class="p-4 text-slate-600">${row.scope}</td>
                                            <td class="p-4">
                                                <span class="px-3 py-1 rounded-full text-xs font-bold border ${getRelevanceBadge(row.relevance)}">${row.relevance}</span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <h3 class="text-2xl font-bold text-slate-800 mb-8">${data.sections.inventory.commentaryTitle}</h3>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            ${data.sections.inventory.commentaryData.map(item => `
                                <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-200 flex flex-col h-full relative overflow-hidden group hover:shadow-xl transition-all">
                                    <div class="absolute top-0 left-0 w-full h-1.5 bg-slate-100 group-hover:bg-report-500 transition-colors"></div>
                                    <div class="flex justify-between items-start mb-6">
                                        <div>
                                            <p class="text-xs font-mono text-slate-400 mb-1">${item.code}</p>
                                            <h4 class="text-2xl font-bold text-slate-800">${item.name}</h4>
                                        </div>
                                        <span class="px-3 py-1 rounded-full text-xs font-bold border ${getRelevanceBadge(item.relevance)}">${item.relevance}</span>
                                    </div>
                                    
                                    <div class="mb-6 flex-grow">
                                        <p class="text-xs uppercase font-bold text-report-500 tracking-widest mb-3">${data.sections.inventory.touchpointsLabel}</p>
                                        <ul class="space-y-2 text-slate-600 text-sm">
                                            ${item.touchpoints.map(t => `<li class="flex items-start gap-2"><div class="w-1.5 h-1.5 rounded-full bg-slate-300 mt-1.5 shrink-0"></div><p>${t}</p></li>`).join('')}
                                        </ul>
                                    </div>
                                    
                                    <div class="pt-5 border-t border-slate-100 mt-auto bg-slate-50 -mx-8 -mb-8 p-8 rounded-b-[2rem]">
                                        <p class="text-xs uppercase font-bold text-slate-400 tracking-widest mb-2">${data.sections.inventory.digitalExposureLabel}</p>
                                        <p class="text-sm font-medium text-slate-700 leading-relaxed">${item.digital}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- DYNAMIC SECTION: VALUE STREAMS -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.valueStreams.sectionTitle, data.sections.valueStreams.titleText, data.sections.valueStreams.subtitleText)}
                        
                        <div class="bg-[#0b1120] rounded-[2.5rem] p-10 md:p-14 shadow-2xl text-white mb-12">
                            <h3 class="text-xl md:text-2xl font-bold text-white mb-10 flex items-center gap-4">
                                <span class="w-8 h-8 rounded-full bg-[#10b981] flex items-center justify-center text-sm font-bold text-white shadow-[0_0_10px_rgba(16,185,129,0.5)]">1</span>
                                ${data.sections.valueStreams.primaryTitle}
                            </h3>
                            
                            <div class="flex flex-wrap items-center gap-x-4 gap-y-6">
                                ${data.sections.valueStreams.primaryData.map((step, i) => `
                                    <div class="flex items-center gap-4">
                                        <div class="bg-[#1e293b] border border-slate-700/60 px-5 py-3 rounded-xl text-sm font-semibold shadow-md text-slate-200">
                                            ${step}
                                        </div>
                                        ${i < data.sections.valueStreams.primaryData.length - 1 ? `
                                            <svg class="w-5 h-5 text-[#10b981]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <h3 class="text-xl font-bold text-slate-800 mb-6">${data.sections.valueStreams.supportingTitle}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${data.sections.valueStreams.supportingData.map(stream => `
                                <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                                    <h4 class="text-lg font-bold text-slate-800 mb-2">${stream.title}</h4>
                                    <p class="text-xs font-mono text-report-500 mb-5 pb-5 border-b border-slate-100">${stream.groups}</p>
                                    <ul class="space-y-3 text-sm text-slate-600">
                                        ${stream.bullets.map(b => `<li class="flex items-start gap-2"><span class="text-report-500 font-bold mt-0.5">›</span> <p>${b}</p></li>`).join('')}
                                    </ul>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- DYNAMIC SECTION: GAP EXPOSURE -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.gapExposure.sectionTitle, data.sections.gapExposure.titleText, data.sections.gapExposure.subtitleText)}
                        
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            ${data.sections.gapExposure.gapData.map(gap => `
                                <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-200 relative overflow-hidden flex flex-col">
                                    <div class="absolute right-0 top-0 bg-red-50 text-red-700 font-bold px-4 py-2 rounded-bl-2xl text-xs border-b border-l border-red-100">
                                        ${gap.id}
                                    </div>
                                    <h4 class="text-xl font-bold text-slate-800 mt-4 mb-2 pr-16">${gap.statement}</h4>
                                    <p class="text-xs font-mono text-slate-400 mb-6">${gap.groups}</p>
                                    
                                    <div class="bg-slate-50 p-5 rounded-xl border border-slate-100 mb-6 text-sm text-slate-700 italic">
                                        "${gap.commentary}"
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-auto">
                                        <div>
                                            <p class="text-[10px] uppercase font-bold text-red-500 tracking-widest mb-1">${data.sections.gapExposure.impactLabel}</p>
                                            <p class="text-sm font-medium text-slate-800">${gap.impact}</p>
                                        </div>
                                        <div>
                                            <p class="text-[10px] uppercase font-bold text-slate-400 tracking-widest mb-1">${data.sections.gapExposure.digitalLabel}</p>
                                            <p class="text-sm font-medium text-slate-600">${gap.digital}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- DYNAMIC SECTION: MATURITY ASSESSMENT -->
                    <div class="col-span-1 md:col-span-12 mt-12 border-t border-slate-200 pt-16">
                        ${renderSectionTitle(data.sections.maturity.sectionTitle, data.sections.maturity.titleText, data.sections.maturity.subtitleText)}
                        
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wider border-b border-slate-200">
                                        ${data.sections.maturity.tableHeaders.map(header => `<th class="p-5 font-bold">${header}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody class="text-slate-800 text-sm divide-y divide-slate-100">
                                    ${data.sections.maturity.tableData.map(row => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-5 font-bold text-slate-700 whitespace-nowrap">${row.function}</td>
                                            <td class="p-5 whitespace-nowrap">
                                                <span class="px-3 py-1 rounded-full text-xs font-bold border ${getMaturityBadge(row.score)}">${row.score}</span>
                                            </td>
                                            <td class="p-5 whitespace-nowrap">
                                                <span class="px-3 py-1 rounded-full text-xs font-bold border ${getRelevanceBadge(row.exposure)}">${row.exposure}</span>
                                            </td>
                                            <td class="p-5 text-slate-600 leading-relaxed">${row.notes}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- DYNAMIC SECTION: EXEC FRAMING & REFERENCE MAP -->
                    <div class="col-span-1 md:col-span-12 flex flex-col gap-16 mt-12 border-t border-slate-200 pt-16 mb-24">
                        
                        <!-- Exec Framing (Dark Indigo Theme matching Reference image, no graphical backgrounds) -->
                        <div class="w-full">
                            <div class="bg-[#1c1938] rounded-[2rem] p-10 md:p-14 shadow-2xl text-white">
                                <p class="text-indigo-400 font-bold tracking-widest uppercase text-[10px] mb-3">${data.sections.executiveFraming.sectionTitle}</p>
                                <h2 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight mb-6">${data.sections.executiveFraming.titleText}</h2>
                                
                                <p class="text-base md:text-lg text-slate-300 leading-relaxed font-light mb-12">
                                    ${data.sections.executiveFraming.summary}
                                </p>
                                
                                <h4 class="text-lg font-bold text-white mb-8 border-b-2 border-slate-600 pb-2 inline-block">${data.sections.executiveFraming.prioritiesTitle}</h4>
                                <ul class="space-y-6">
                                    ${data.sections.executiveFraming.prioritiesData.map((priority, i) => `
                                        <li class="flex items-start gap-4">
                                            <div class="w-6 h-6 rounded-full border border-indigo-400 text-indigo-300 font-semibold flex items-center justify-center shrink-0 mt-0.5 text-xs">
                                                ${i+1}
                                            </div>
                                            <p class="text-slate-300 text-sm leading-relaxed">${priority}</p>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>

                        <!-- Reference Map (Light Minimalist Theme) -->
                        <div class="w-full mt-4">
                            <div class="mb-8 border-l-[3px] border-blue-600 pl-4 py-0.5">
                                <p class="text-blue-600 font-bold tracking-widest uppercase text-[10px] mb-1">${data.sections.referenceMap.sectionTitle}</p>
                                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">${data.sections.referenceMap.titleText}</h2>
                                <p class="text-xs text-slate-500 mt-1">${data.sections.referenceMap.subtitleText}</p>
                            </div>
                            
                            <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-slate-200 overflow-x-auto table-container">
                                <table class="w-full text-left min-w-[900px]">
                                    <thead>
                                        <tr class="text-slate-500 uppercase text-[10px] tracking-wider border-b border-slate-200 bg-slate-50/50">
                                            ${data.sections.referenceMap.tableHeaders.map(header => `<th class="p-5 font-bold">${header}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody class="text-slate-600 text-xs divide-y divide-slate-100">
                                        ${data.sections.referenceMap.tableData.map(ref => `
                                            <tr class="hover:bg-slate-50 transition-colors">
                                                <td class="p-5 font-bold text-slate-800 whitespace-nowrap">${ref.objectType || ''}</td>
                                                <td class="p-5 leading-relaxed text-slate-500">${ref.source || ''}</td>
                                                <td class="p-5 font-mono text-[11px] text-blue-600 font-medium">${ref.codes || ''}</td>
                                                <td class="p-5 text-slate-400">${ref.usage || ''}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </main>
            `;
            
            app.innerHTML = html;
        });
    </script>
</body>
</html>
