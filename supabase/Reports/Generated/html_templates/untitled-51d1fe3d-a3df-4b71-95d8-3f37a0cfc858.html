    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Retrieve JSON directly from the embedded script tag instead of external source
            const rawData = JSON.parse(document.getElementById('report-data').textContent);
            
            // Dynamic Tailwind Configuration based on JSON Theme
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Inter', 'sans-serif'] },
                        colors: {
                            report: {
                                primary: rawData.theme.primary,
                                accent: rawData.theme.accent,
                                dark: rawData.theme.dark,
                                bg: rawData.theme.roadmapBg
                            }
                        }
                    }
                }
            };

            const app = document.getElementById('app');

            // --- UI Helper Functions ---
            const renderSectionTitle = (number, title, subtitle = '') => `
                <div class="flex flex-col mb-10 border-l-[6px] border-[${rawData.theme.primary}] pl-6 py-1">
                    <p class="text-[${rawData.theme.primary}] font-bold tracking-[0.2em] uppercase text-xs mb-2">Section 0${number}</p>
                    <h2 class="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight">${title}</h2>
                    ${subtitle ? `<p class="text-lg text-slate-500 mt-3 font-light max-w-3xl">${subtitle}</p>` : ''}
                </div>
            `;

            const renderDoughnutChart = (breakdownData, totalValue, totalLabel) => {
                let currentPct = 0;
                const gradientString = breakdownData.map(item => {
                    const pct = (item.value / totalValue) * 100;
                    const str = `${item.color} ${currentPct}% ${currentPct + pct}%`;
                    currentPct += pct;
                    return str;
                }).join(', ');

                return `
                    <div class="bg-white rounded-[2rem] p-6 md:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-slate-100 flex flex-col xl:flex-row items-center gap-10 w-full h-full">
                        
                        <!-- Left: Doughnut Chart -->
                        <div class="relative w-56 h-56 rounded-full flex-shrink-0 flex items-center justify-center" style="background: conic-gradient(${gradientString})">
                            <div class="absolute w-40 h-40 bg-white rounded-full flex flex-col items-center justify-center shadow-[inset_0_2px_10px_rgba(0,0,0,0.02)]">
                                <span class="text-5xl font-black text-slate-800 tracking-tight">${totalValue}</span>
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">${totalLabel}</span>
                            </div>
                        </div>

                        <!-- Right: Legend Rows -->
                        <div class="flex flex-col gap-3 w-full">
                            ${breakdownData.map(item => `
                                <div class="flex items-center justify-between p-4 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md transition-shadow">
                                    <div class="flex items-center gap-4">
                                        <div class="w-4 h-4 rounded-full shadow-sm" style="background-color: ${item.color}"></div>
                                        <span class="font-bold text-slate-700 text-sm md:text-base">${item.label}</span>
                                    </div>
                                    <div class="flex items-center gap-5 md:gap-8">
                                        ${item.impact ? `
                                        <div class="flex flex-col items-end hidden sm:flex">
                                            <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Impact</span>
                                            <span class="px-2.5 py-1 rounded text-[10px] font-bold border ${item.impactClass}">${item.impact}</span>
                                        </div>
                                        <div class="w-px h-8 bg-slate-200 hidden sm:block"></div>
                                        ` : ''}
                                        <div class="flex flex-col items-center min-w-[3rem]">
                                            <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Count</span>
                                            <span class="text-2xl md:text-3xl font-black" style="color: ${item.color}">${item.value}</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            };

            // Setup variables based on dynamic generic JSON structure
            const s1 = rawData.sections.section_01;
            const s2 = rawData.sections.section_02;
            const s3 = rawData.sections.section_03;
            const s4 = rawData.sections.section_04;
            const s5 = rawData.sections.section_05;
            const s6 = rawData.sections.section_06;
            
            const kpiCards = s2.sub_sections.kpi_cards;
            const tableHeaders = s5.sub_sections.table_headers;
            const mapHeaders = s6.sub_sections.mapping_headers;

                    <div class="absolute inset-0 bg-gradient-to-tr from-[${rawData.theme.dark}] via-slate-800 to-[${rawData.theme.roadmapBg}] opacity-90"></div>

                        <div class="mb-6 inline-flex items-center gap-3">
                            <span class="px-4 py-1.5 rounded-full border border-[${rawData.theme.primary}]/50 bg-[${rawData.theme.primary}]/20 text-[${rawData.theme.primary}] text-sm font-bold tracking-widest uppercase shadow-lg shadow-[${rawData.theme.primary}]/20">
                                ${rawData.metadata.documentId}
                            </span>
                            <span class="px-4 py-1.5 rounded-full border border-slate-500/50 bg-slate-800/50 text-slate-300 text-sm font-bold tracking-widest uppercase shadow-lg">
                                ${rawData.metadata.modeLabel}: ${rawData.metadata.mode}
                            </span>
                        </div>
                        
                        <h1 class="text-6xl md:text-8xl font-black tracking-tight mb-6 text-white leading-[1.1]">
                            ${rawData.metadata.title.split(' - ')[0]} <br/> 
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-[${rawData.theme.primary}] to-emerald-300">
                                ${rawData.metadata.title.split(' - ').slice(1).join(' - ') || rawData.metadata.title}
                            </span>
                        </h1>
                        <h2 class="text-2xl md:text-3xl font-light text-slate-300 mb-16 max-w-4xl leading-relaxed">
                            ${rawData.metadata.subtitle}
                        </h2>

                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 pt-8 border-t border-white/10">
                            <div>
                                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">${rawData.metadata.facilityLabel}</p>
                                <p class="font-medium text-white text-lg">${rawData.metadata.plant}</p>
                            </div>
                            <div>
                                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-2">${rawData.metadata.dateLabel}</p>
                                <p class="font-medium text-white text-lg">${rawData.metadata.date}</p>
                            </div>
                        </div>
                    </div>
                </section>

                <main class="max-w-[1440px] mx-auto px-6 md:px-12 py-24 space-y-32">

                    <!-- SECTION 1 & 2 COMBINED: PURPOSE & DASHBOARD METRICS -->
                    <section class="grid grid-cols-1 xl:grid-cols-12 gap-12 items-center">
                        <div class="xl:col-span-5">
                            ${renderSectionTitle('1', s1.title, s1.subtitle)}
                            
                            <div class="space-y-8 text-lg font-light text-slate-700 leading-relaxed">
                                <p>${s1.sub_sections.narrative.text}</p>
                                
                                <div class="bg-slate-900 text-white rounded-[2rem] p-8 shadow-2xl relative overflow-hidden">
                                    <div class="absolute top-0 left-0 w-2 h-full bg-[${rawData.theme.primary}]"></div>
                                    <p class="relative z-10 italic">"${s1.sub_sections.narrative.takeaway}"</p>
                                </div>
                            </div>
                        </div>

                        <!-- Dashboard Metrics Widget -->
                        <div class="xl:col-span-7 h-full flex flex-col gap-6">
                            <div class="grid grid-cols-2 gap-6">
                                <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm flex flex-col justify-center">
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">${kpiCards.issues.label}</p>
                                    <p class="text-5xl font-black ${kpiCards.issues.colorClass} mb-1">${kpiCards.issues.value}</p>
                                    <p class="text-sm text-slate-500 font-medium mt-auto">${kpiCards.issues.description}</p>
                                </div>
                                <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm flex flex-col justify-center">
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">${kpiCards.highRisk.label}</p>
                                    <p class="text-5xl font-black ${kpiCards.highRisk.colorClass} mb-1">${kpiCards.highRisk.value}</p>
                                    <p class="text-sm text-slate-500 font-medium mt-auto">${kpiCards.highRisk.description}</p>
                                </div>
                            </div>
                            
                            ${renderDoughnutChart(s2.sub_sections.doughnut_chart, kpiCards.totalRows.value, kpiCards.totalRows.label)}
                        </div>
                    </section>

                    <!-- SECTION 3: CONSULTANT OBSERVATIONS -->
                    <section>
                        ${renderSectionTitle('3', s3.title, s3.subtitle)}
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${s3.sub_sections.observation_cards.map(obs => `
                                <div class="bg-white rounded-[2rem] p-8 md:p-10 shadow-lg shadow-slate-200/50 border border-slate-100 hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 flex flex-col h-full group">
                                    <div class="w-14 h-14 rounded-2xl bg-[${rawData.theme.primary}]/10 text-[${rawData.theme.primary}] flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                    </div>
                                    <h3 class="text-2xl font-bold text-slate-900 mb-6 leading-tight">${obs.title}</h3>
                                    
                                    <div class="space-y-6 flex-grow">
                                        <div>
                                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Evidence Pattern</p>
                                            <p class="text-sm text-slate-600 leading-relaxed">${obs.pattern}</p>
                                        </div>
                                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                                            <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                                <p class="text-[10px] font-black text-red-500 uppercase tracking-widest mb-1">Op. Effect</p>
                                                <p class="text-xs text-slate-700">${obs.effect}</p>
                                            </div>
                                            <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                                <p class="text-[10px] font-black text-orange-500 uppercase tracking-widest mb-1">Biz Risk</p>
                                                <p class="text-xs text-slate-700">${obs.risk}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="pt-6 border-t border-slate-100 mt-6">
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Digital Implication</p>
                                        <p class="text-sm font-medium text-slate-800 leading-relaxed">${obs.implication}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- SECTION 4: FINDING SUMMARY -->
                    <section>
                        ${renderSectionTitle('4', s4.title, s4.subtitle)}
                        
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                            <!-- Metrics Cards -->
                            <div class="lg:col-span-4 flex flex-col justify-center gap-5">
                                ${s4.sub_sections.metrics.map(m => `
                                    <div class="bg-white rounded-[1.5rem] p-6 border border-slate-200 shadow-[0_4px_15px_rgb(0,0,0,0.03)] flex justify-between items-center group hover:border-[${rawData.theme.primary}] transition-colors">
                                        <span class="text-sm font-bold text-slate-500 uppercase tracking-widest w-2/3 group-hover:text-slate-800 transition-colors">${m.label}</span>
                                        <span class="text-5xl font-black text-[${rawData.theme.primary}]">${m.value}</span>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <!-- Traceability Statement -->
                            <div class="lg:col-span-8 flex">
                                <div class="bg-[#0f172a] rounded-[2.5rem] p-10 lg:p-14 text-white shadow-2xl relative overflow-hidden flex flex-col justify-center w-full border border-slate-800">

                                    <p class="text-xl font-light text-slate-300 leading-relaxed relative z-10">
                                        ${s4.sub_sections.traceability.text}
                                    </p>
                                </div>
                            </div>
                        </div>

                        ${renderSectionTitle('5', s5.title, s5.subtitle)}
                        
                        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden">
                            <div class="overflow-x-auto w-full max-h-[800px] overflow-y-auto" style="scrollbar-width: thin; scrollbar-color: #cbd5e1 #f8fafc;">
                                <table class="w-full text-left border-collapse min-w-[1500px]">
                                    <thead class="bg-slate-900 text-white sticky top-0 z-20">
