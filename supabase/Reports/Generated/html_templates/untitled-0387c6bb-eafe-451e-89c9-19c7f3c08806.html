                "Appoint Planning Config Steward and MES Administrator (Month 1) to start Day 1 responsibilities.",

<body class="bg-slate-50 text-slate-800 selection:bg-brand-primary selection:text-white pb-24">

                        </div>

                        <div class="bg-slate-50 rounded-3xl p-1 shadow-sm border border-slate-200">
                            <div class="bg-white rounded-[1.4rem] overflow-hidden table-wrapper">
                                <table class="w-full text-left min-w-[800px]">
                                    <thead><tr class="bg-slate-100 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200"><th class="p-4 font-bold">Code</th><th class="p-4 font-bold">Source → Target</th><th class="p-4 font-bold">Integration Name</th><th class="p-4 font-bold">Status</th></tr></thead>
                                    <tbody class="divide-y divide-slate-100 text-sm">
                                        ${secs.integration.subsections.points.items.map(ip => `
                                            <tr class="hover:bg-slate-50"><td class="p-4 font-mono font-bold text-slate-600">${ip.code}</td><td class="p-4 text-xs font-mono bg-slate-50"><span class="text-slate-400">${ip.src}</span> <span class="text-brand-primary">→</span> <span class="text-slate-800">${ip.tgt}</span></td><td class="p-4 font-medium text-slate-800">${ip.name}</td><td class="p-4"><span class="px-2 py-1 text-[10px] uppercase rounded font-bold ${ip.status.includes('Confirmed') ? 'bg-emerald-100 text-emerald-700' : ip.status === 'Internal' ? 'bg-slate-200 text-slate-600' : 'bg-orange-100 text-orange-700'}">${ip.status}</span></td></tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 5. GOVERNANCE -->
                <section id="governance" class="bg-slate-50 py-24 border-t border-slate-200">
                    <div class="max-w-7xl mx-auto px-6 md:px-12">
                        ${renderSectionTitle('Operating Model', secs.governance.title)}
                        
                        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                            <div class="lg:col-span-1 space-y-6">
                                <h3 class="font-bold text-xl text-brand-dark mb-4">${secs.governance.subsections.principles.title}</h3>
                                ${secs.governance.subsections.principles.items.map(p => `<div class="bg-white border-l-4 border-brand-primary p-4 shadow-sm"><p class="font-bold text-sm text-slate-800">${p}</p></div>`).join('')}
                                <h3 class="font-bold text-xl text-brand-dark mt-12 mb-4">${secs.governance.subsections.permissions.title}</h3>
                                <div class="flex flex-wrap gap-2">${secs.governance.subsections.permissions.items.map(p => `<span class="bg-brand-dark text-white text-xs px-3 py-1.5 rounded-full shadow-sm">${p}</span>`).join('')}</div>
                            </div>
                            
                            <div class="lg:col-span-3">
                                <h3 class="font-bold text-xl text-brand-dark mb-4">${secs.governance.subsections.matrix.title}</h3>
                                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-12 table-wrapper">
                                    <table class="w-full text-left min-w-[600px]">
                                        <thead><tr class="bg-slate-100 text-slate-500 text-[10px] uppercase tracking-wider border-b border-slate-200"><th class="p-4">Module</th><th class="p-4">Primary Owner (R)</th><th class="p-4">Reviewer (V)</th></tr></thead>
                                        <tbody class="divide-y divide-slate-100 text-sm">
                                            ${secs.governance.subsections.matrix.items.map(m => `<tr><td class="p-4 font-bold text-slate-700">${m.module}</td><td class="p-4 text-brand-primary font-medium">${m.primary}</td><td class="p-4 text-slate-600">${m.review}</td></tr>`).join('')}
                                        </tbody>
                                    </table>
                                </div>

                                <h3 class="font-bold text-xl text-brand-dark mb-4">${secs.governance.subsections.keyRoles.title}</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${secs.governance.subsections.keyRoles.items.map(r => `
                                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <p class="text-xs font-mono text-slate-400 mb-1">${r.code}</p>
                                            <h4 class="font-bold text-brand-primary text-lg mb-2">${r.title}</h4>
                                            <p class="text-sm text-slate-600 mb-3">${r.desc}</p>
                                            <div class="bg-slate-50 p-2 rounded border border-slate-100"><p class="text-[10px] uppercase font-bold text-slate-400 mb-1">Data Ownership</p><p class="text-xs font-medium text-slate-700">${r.data}</p></div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 6. DELIVERY -->
                <section id="delivery" class="bg-white py-24 border-t border-slate-200">
                    <div class="max-w-7xl mx-auto px-6 md:px-12">
                        ${renderSectionTitle('Execution', secs.delivery.title)}
                        
                        <!-- KPIs -->
                        <h3 class="font-bold text-2xl text-brand-dark mb-6">${secs.delivery.subsections.kpiFramework.title}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                            ${secs.delivery.subsections.kpiFramework.items.map(kpi => `
                                <div class="bg-brand-dark rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
                                    <div class="absolute -right-4 -top-4 w-24 h-24 bg-brand-primary/30 rounded-full blur-xl"></div>
                                    <p class="text-brand-accent text-xs font-bold uppercase tracking-widest mb-2">${kpi.code}</p>
                                    <h3 class="text-xl font-bold mb-4 pr-8">${kpi.name}</h3>
                                    <div class="flex items-end gap-2 mb-4"><span class="text-4xl font-black text-brand-primary leading-none">${kpi.target}</span><span class="text-sm text-slate-400 pb-1">Target</span></div>
                                    <p class="text-slate-300 text-sm leading-relaxed">${kpi.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                        <div class="bg-slate-50 border border-slate-200 p-6 rounded-2xl mb-20">
                            <h4 class="font-bold text-sm text-slate-800 mb-3">${secs.delivery.subsections.kpiGovernance.title}</h4>
                            <ul class="text-sm text-slate-600 list-disc pl-5 space-y-1">${secs.delivery.subsections.kpiGovernance.items.map(k=>`<li>${k}</li>`).join('')}</ul>
                        </div>

                        <!-- Roadmap -->
                        <div class="flex flex-col lg:flex-row justify-between lg:items-end mb-8 gap-4">
                            <h3 class="font-bold text-2xl text-brand-dark">${secs.delivery.subsections.phases.title}</h3>
                            <div class="bg-brand-light border border-brand-primary/20 px-4 py-2 rounded-lg"><p class="text-[10px] font-bold text-brand-primary uppercase tracking-wider mb-1">Guiding Principles</p><p class="text-xs text-slate-600">${secs.delivery.subsections.roadmapPrinciples.items[0].split(':')[0]} | ${secs.delivery.subsections.roadmapPrinciples.items[1].split(':')[0]}</p></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                            ${secs.delivery.subsections.phases.items.map((phase, i) => `
                                <div class="relative group">
                                    ${i !== 3 ? `<div class="hidden lg:block absolute top-6 left-[60%] w-full h-px bg-slate-200"></div>` : ''}
                                    <div class="w-12 h-12 rounded-full bg-slate-50 border-2 border-brand-primary text-brand-primary flex items-center justify-center font-bold text-lg mb-6 relative z-10">${i+1}</div>
                                    <h4 class="text-xl font-bold text-brand-dark mb-1">${phase.title}</h4>
                                    <p class="text-brand-primary font-semibold text-sm mb-3">${phase.duration}</p>
                                    <p class="text-slate-600 text-sm leading-relaxed">${phase.focus}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>

                <!-- 7. RISKS & OPEN QUESTIONS -->
                <section id="risksAndNext" class="bg-slate-50 py-24 border-t border-slate-200">
                    <div class="max-w-7xl mx-auto px-6 md:px-12">
                        ${renderSectionTitle('Readiness', secs.risksAndNext.title, secs.risksAndNext.subsections.riskSummary.content)}
                        
                        <div class="grid grid-cols-1 xl:grid-cols-2 gap-16">
                            <!-- Risks & Immediate Steps -->
                            <div class="space-y-10">
                                <div>
                                    <h3 class="font-bold text-2xl text-brand-dark mb-6">${secs.risksAndNext.subsections.immediateSteps.title}</h3>
                                    <ul class="space-y-3">
                                        ${secs.risksAndNext.subsections.immediateSteps.items.map((step, i) => `
                                            <li class="flex items-start gap-3 bg-white border border-slate-200 p-4 rounded-xl shadow-sm"><span class="w-6 h-6 rounded-full bg-slate-100 text-slate-600 flex justify-center items-center font-bold text-xs shrink-0">${i+1}</span><p class="text-sm text-slate-700">${step}</p></li>
                                        `).join('')}
                                    </ul>
                                </div>
                                <div>
                                    <h3 class="font-bold text-2xl text-brand-dark mb-6">${secs.risksAndNext.subsections.riskRegister.title}</h3>
                                    <div class="space-y-4">
                                        ${secs.risksAndNext.subsections.riskRegister.items.map(r => `
                                            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-4">
                                                <div class="shrink-0"><span class="px-2 py-1 text-[10px] font-bold uppercase tracking-wider rounded ${r.rating === 'CRITICAL' ? 'bg-red-100 text-red-700' : r.rating === 'HIGH' ? 'bg-orange-100 text-orange-700' : 'bg-yellow-100 text-yellow-700'}">${r.rating}</span></div>
                                                <div><h4 class="font-bold text-slate-800 text-sm mb-1"><span class="text-slate-400 mr-2">${r.id}</span>${r.title}</h4><p class="text-xs text-slate-500"><span class="font-semibold text-slate-600">Mitigation:</span> ${r.mitigation}</p></div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>

                            <!-- Open Questions -->
                            <div>
                                <h3 class="font-bold text-2xl text-brand-dark mb-6">${secs.risksAndNext.subsections.openQuestions.title}</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    ${secs.risksAndNext.subsections.openQuestions.items.map(oq => `
                                        <div class="bg-white border-l-4 border-brand-accent p-4 rounded shadow-sm">
                                            <p class="text-[10px] font-bold text-slate-400 mb-1">${oq.id}</p>
                                            <h4 class="font-bold text-sm text-slate-800 mb-2">${oq.topic}</h4>
                                            <p class="text-xs text-slate-600">${oq.detail}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 8. APPENDICES -->
                <section id="appendices" class="bg-white py-24 border-t border-slate-200">
                    <div class="max-w-7xl mx-auto px-6 md:px-12">
                        ${renderSectionTitle('Reference Data', secs.appendices.title)}
                        
                        <details class="mb-6 bg-slate-50 border border-slate-200 rounded-2xl group">
                            <summary class="font-bold text-lg p-6 flex justify-between items-center cursor-pointer text-brand-dark">
                                ${secs.appendices.subsections.glossary.title} <span class="text-brand-primary">Expand ↓</span>
                            </summary>
                            <div class="p-6 pt-0 border-t border-slate-200">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                                    ${secs.appendices.subsections.glossary.items.map(g => `<div class="text-sm bg-white p-3 rounded border border-slate-100"><span class="font-bold text-brand-dark">${g.term}:</span> <span class="text-slate-600 block mt-1">${g.def}</span></div>`).join('')}
                                </div>
                            </div>
                        </details>

                        <details class="bg-slate-50 border border-slate-200 rounded-2xl group">
                            <summary class="font-bold text-lg p-6 flex justify-between items-center cursor-pointer text-brand-dark">
                                ${secs.appendices.subsections.dataPoints.title} <span class="text-brand-primary">Expand ↓</span>
                            </summary>
                            <div class="p-6 pt-0 border-t border-slate-200">
                                <div class="table-wrapper mt-6 bg-white rounded-xl border border-slate-200">
                                    <table class="w-full text-left min-w-[700px]">
                                        <thead><tr class="text-[10px] font-bold uppercase tracking-wider text-slate-500 border-b border-slate-200 bg-slate-50"><th class="py-3 px-4">Code</th><th class="py-3 px-4">Name</th><th class="py-3 px-4">Source</th><th class="py-3 px-4">Target</th></tr></thead>
                                        <tbody class="text-sm divide-y divide-slate-100">
                                            ${secs.appendices.subsections.dataPoints.items.map(dp => `<tr><td class="py-3 px-4 font-mono text-xs text-brand-primary">${dp.code}</td><td class="py-3 px-4 font-medium text-slate-700">${dp.name}</td><td class="py-3 px-4 text-slate-500">${dp.src}</td><td class="py-3 px-4 text-slate-500">${dp.tgt}</td></tr>`).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </details>
                    </div>
                </section>

                <!-- FOOTER -->
                <footer class="bg-brand-dark text-slate-400 py-12 text-center text-sm border-t border-white/10">
                    <p>&copy; 2026 Machine Vision Indoensia. ${meta.classification}</p>
                </footer>
            `;
            
            app.innerHTML = html;
            window.renderCarouselSlide(); // Init Carousel
        });
    </script>
</body>
</html>
