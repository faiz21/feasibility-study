    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(document.getElementById('report-data').textContent);
            const app = document.getElementById('app');

            // --- RENDER HELPERS ---
            
            const renderSectionTitle = (sectionNumber, titleText) => `
                <div class="flex items-stretch gap-4 mb-10">
                    <div class="w-1.5 bg-report-900 rounded-full"></div>
                    <div class="py-1">
                        <p class="text-report-500 font-bold tracking-widest uppercase text-xs mb-1">${sectionNumber}</p>
                        <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">${titleText}</h2>
                    </div>
                </div>
            `;

            const renderSubSectionTitle = (title, subtitle, isDark = false) => {
                if (!title) return '';
                const titleColor = isDark ? 'text-white' : 'text-slate-800';
                const subtitleColor = isDark ? 'text-slate-400' : 'text-slate-500';
                
                return `
                    <div class="mb-6 mt-8">
                        <h3 class="text-2xl font-bold ${titleColor} tracking-tight">${title}</h3>
                        ${subtitle ? `<p class="text-sm ${subtitleColor} mt-1">${subtitle}</p>` : ''}
                    </div>
                `;
            };

            const renderPieChart = (chart, isDark = false) => {
                let currentPct = 0;
                const gradientString = chart.data.map(item => {
                    const pct = (item.value / chart.total) * 100;
                    const str = `${item.color} ${currentPct}% ${currentPct + pct}%`;
                    currentPct += pct;
                    return str;
                }).join(', ');

                const titleColor = isDark ? 'text-slate-100' : 'text-slate-800';
                const valColor = isDark ? 'text-slate-400' : 'text-slate-500';
                const descColor = isDark ? 'text-slate-400' : 'text-slate-500';
                const borderColor = isDark ? 'border-slate-700' : 'border-slate-100';

                return `
                    <div class="flex flex-col xl:flex-row items-center justify-center gap-8 w-full">
                        <div class="w-36 h-36 rounded-full shadow-inner border ${borderColor} flex-shrink-0" style="background: conic-gradient(${gradientString})"></div>
                        <div class="space-y-4 w-full max-w-sm">
                            ${chart.data.map(item => `
                                <div class="flex items-start gap-3">
                                    <div class="w-4 h-4 rounded-full mt-0.5 shadow-sm shrink-0" style="background-color: ${item.color}"></div>
                                    <div>
                                        <p class="font-bold ${titleColor} leading-none">${item.label} <span class="${valColor} font-medium ml-1">(${item.value})</span></p>
                                        <p class="text-xs ${descColor} mt-1">${item.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            };

            const renderProgressChart = (chart) => {
                return `
                    <div class="space-y-6 w-full max-w-lg mx-auto">
                        ${chart.data.map(item => `
                            <div>
                                <div class="flex justify-between text-sm font-bold text-slate-700 mb-2">
                                    <span>${item.label}</span>
                                    <div class="flex items-center gap-3 text-xs font-medium text-slate-500">
                                        <div class="flex items-center gap-1"><div class="w-2.5 h-2.5 bg-indigo-500 rounded-sm"></div> DI: ${item.di}</div>
                                        <div class="flex items-center gap-1"><div class="w-2.5 h-2.5 bg-teal-400 rounded-sm"></div> DO: ${item.do}</div>
                                    </div>
                                </div>
                                <div class="w-full flex flex-col gap-1.5">
                                    <div class="w-full bg-slate-100 rounded-full h-2.5 flex overflow-hidden">
                                        <div class="bg-indigo-500 h-2.5 rounded-full" style="width: ${(item.di / item.max) * 100}%"></div>
                                    </div>
                                    <div class="w-full bg-slate-100 rounded-full h-2.5 flex overflow-hidden">
                                        <div class="bg-teal-400 h-2.5 rounded-full" style="width: ${(item.do / item.max) * 100}%"></div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            };

            // --- GENERIC SUB-SECTION RENDERER ---

            const renderSubSections = (subSections) => {
                return Object.entries(subSections).map(([key, block]) => {
                    switch(block.type) {
                        case 'textBlock':
                            return `
                                <div class="col-span-1 md:col-span-8 md:col-start-3 space-y-10 text-xl font-light mb-16">
                                    <p class="text-slate-700 leading-relaxed">${block.text}</p>
                                    ${block.takeaway ? `
                                    <blockquote class="bg-slate-900 rounded-[2.5rem] p-10 md:p-14 text-white shadow-2xl relative overflow-hidden transform md:scale-105 my-12">
                                        <div class="absolute left-0 top-0 bottom-0 w-2.5 bg-gradient-to-b from-indigo-400 to-report-500"></div>
                                        <p class="relative z-10 text-2xl md:text-3xl font-light leading-relaxed">${block.takeaway}</p>
                                    </blockquote>` : ''}
                                </div>
                            `;
                        
                        case 'metricsGrid':
                            return `
                                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mb-12 mt-8">
                                    ${block.items.map(m => `
                                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col justify-center items-center text-center">
                                            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">${m.label}</p>
                                            <p class="text-3xl font-black text-slate-800 mb-1">${m.value}</p>
                                            ${m.subtext ? `<p class="text-xs text-slate-500">${m.subtext}</p>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            `;

                        case 'rulesList':
                            return `
                                <div class="bg-indigo-50 border border-indigo-100 rounded-3xl p-8 shadow-sm max-w-5xl mx-auto mb-16 mt-8">
                                    ${block.title ? `<h4 class="text-lg font-bold text-report-800 mb-4 flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>${block.title}</h4>` : ''}
                                    <ul class="space-y-3 text-sm text-indigo-900 list-disc pl-5">
                                        ${block.items.map(item => `<li>${item}</li>`).join('')}
                                    </ul>
                                </div>
                            `;

                        case 'genericTable':
                            const isDarkTab = block.style === 'dark';
                            const bgClass = isDarkTab ? 'bg-[#0f172a] border-slate-800 shadow-2xl' : 'bg-white border-slate-200 shadow-lg';
                            const thClass = isDarkTab ? 'bg-transparent text-slate-400 border-b border-slate-800' : 'bg-slate-900 text-white';
                            const trClass = isDarkTab ? 'hover:bg-slate-800/40 text-slate-300' : 'hover:bg-slate-50 text-slate-700 divide-y divide-slate-100';
                            const tdClass = isDarkTab ? 'text-white' : '';

                            return `
                                <div class="mb-16 mt-8">
                                    ${renderSubSectionTitle(block.title, block.subtitle, isDarkTab)}
                                    <div class="${bgClass} rounded-[2.5rem] p-2 md:p-6 overflow-hidden border table-container overflow-x-auto">
                                        <table class="w-full text-left min-w-[800px] border-collapse">
                                            <thead>
                                                <tr class="${thClass} uppercase text-xs tracking-wider">
                                                    ${block.columns.map(col => `<th class="p-4 font-semibold">${col}</th>`).join('')}
                                                </tr>
                                            </thead>
                                            <tbody class="text-sm ${trClass}">
                                                ${block.rows.map(row => `
                                                    <tr class="transition-colors border-b ${isDarkTab ? 'border-slate-800/60' : 'border-slate-100'} last:border-none">
                                                        ${row.map(cell => `<td class="p-4 ${tdClass}">${cell}</td>`).join('')}
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `;

                        case 'insightCards':
                            return `<div class="flex flex-col gap-8 pb-8 mb-16 mt-8">` + block.items.map(obs => {
                                if (obs.style === 'dark') {
                                    return `
                                        <div class="bg-[#0f172a] rounded-[2rem] p-8 md:p-10 shadow-xl relative overflow-hidden border border-slate-800 flex flex-col lg:flex-row gap-8 lg:gap-12 w-full">
                                            <div class="absolute right-0 top-0 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                                            <div class="flex-1 w-full lg:w-1/2 relative z-10 flex flex-col justify-center">
                                                <h3 class="text-2xl font-bold text-white mb-6 flex items-center gap-3">
                                                    <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                                                    ${obs.title}
                                                </h3>
                                                ${obs.content ? `<p class="text-slate-300 leading-relaxed text-lg">${obs.content}</p>` : ''}
                                                ${obs.bullets ? `<ul class="space-y-4">
                                                    ${obs.bullets.map(b => `
                                                        <li class="flex items-start gap-4 text-slate-300 text-lg font-light leading-relaxed">
                                                            <span class="w-2 h-2 rounded-full bg-indigo-400 mt-2.5 shrink-0 shadow-[0_0_8px_rgba(129,140,248,0.8)]"></span>
                                                            <p>${b}</p>
                                                        </li>
                                                    `).join('')}
                                                </ul>` : ''}
                                            </div>
                                            ${obs.chart ? `
                                                <div class="flex-1 w-full lg:w-1/2 lg:border-l border-slate-700/50 lg:pl-10 flex flex-col justify-center relative z-10">
                                                    ${renderPieChart(obs.chart, true)}
                                                </div>
                                            ` : ''}
                                        </div>
                                    `;
                                } else {
                                    return `
                                        <div class="bg-white rounded-[2rem] p-8 md:p-10 shadow-sm border border-slate-200 flex flex-col lg:flex-row gap-8 lg:gap-12 items-center w-full">
                                            <div class="flex-1 w-full lg:w-1/2 flex flex-col justify-center">
                                                <h3 class="text-2xl font-bold text-slate-800 mb-4">${obs.title}</h3>
                                                ${obs.content ? `<p class="text-slate-600 leading-relaxed text-lg">${obs.content}</p>` : ''}
                                                ${obs.bullets ? `<ul class="space-y-4">
                                                    ${obs.bullets.map(b => `
                                                        <li class="flex items-start gap-4 text-slate-600 text-lg font-light leading-relaxed">
                                                            <span class="w-2 h-2 rounded-full bg-indigo-400 mt-2.5 shrink-0"></span>
                                                            <p>${b}</p>
                                                        </li>
                                                    `).join('')}
                                                </ul>` : ''}
                                            </div>
                                            ${obs.chart ? `
                                                <div class="flex-1 w-full lg:w-1/2 lg:border-l border-slate-100 lg:pl-10 flex flex-col justify-center">
                                                    ${obs.chart.type === 'pie' ? renderPieChart(obs.chart, false) : ''}
                                                    ${obs.chart.type === 'progress' ? renderProgressChart(obs.chart) : ''}
                                                </div>
                                            ` : ''}
                                        </div>
                                    `;
                                }
                            }).join('') + `</div>`;

                        case 'bulletList':
                            const isDarkList = block.style === 'dark';
                            const bgContainer = isDarkList ? 'bg-[#0f172a] p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-slate-800 relative overflow-hidden' : '';
                            const itemBg = isDarkList ? 'bg-slate-800/40 border-slate-700/50 hover:bg-slate-800/60' : 'bg-white border-slate-200 shadow-sm hover:shadow-md';
                            const textColor = isDarkList ? 'text-slate-200' : 'text-slate-700';
                            const iconColor = isDarkList ? 'text-indigo-400' : 'text-indigo-500';
                            const iconBorder = isDarkList ? 'border-indigo-400/50' : 'border-indigo-500';

                            return `
                                <div class="w-full mb-16 mt-8 ${bgContainer}">
                                    ${isDarkList ? '<div class="absolute right-0 top-0 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>' : ''}
                                    <div class="relative z-10">
                                        ${renderSubSectionTitle(block.title, block.subtitle, isDarkList)}
                                        <ul class="space-y-4 max-w-5xl">
                                            ${block.items.map(item => `
                                                <li class="flex items-center gap-4 ${itemBg} p-5 rounded-2xl border transition-all duration-300">
                                                    <div class="w-6 h-6 rounded-full border-2 ${iconBorder} flex items-center justify-center shrink-0 ${isDarkList ? 'shadow-[0_0_10px_rgba(99,102,241,0.2)]' : ''}">
                                                        <svg class="w-3.5 h-3.5 ${iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                                    </div>
                                                    <p class="text-base ${textColor} font-medium leading-relaxed">${item}</p>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                </div>
                            `;
                        default:
                            return '';
                    }
                }).join('');
            };

            // --- MAIN LAYOUT ASSEMBLY ---

            const html = `
                <!-- COVER COMPONENT -->
                <section class="h-[95vh] flex flex-col justify-end p-8 md:p-16 lg:p-24 hero-bg text-white relative">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent mix-blend-multiply"></div>
                    <div class="relative z-10 max-w-5xl">
                        <div class="mb-6 inline-flex items-center px-4 py-1.5 rounded-full border border-report-500/50 bg-report-500/20 text-indigo-100 text-sm font-semibold tracking-wide uppercase shadow-lg">
                            ${data.metadata.documentId}
                        </div>
                        <h1 class="text-6xl md:text-8xl font-bold tracking-tight mb-4 text-white drop-shadow-sm">
                            ${data.metadata.title.split('-')[0]} <br/> <span class="text-report-500">${data.metadata.title.split('-')[1] || ''}</span>
                        </h1>
                        <h2 class="text-2xl md:text-3xl font-light text-slate-300 mb-12 max-w-3xl leading-snug">
                            ${data.metadata.subtitle}
                        </h2>

                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 border-t border-white/20 pt-8 mt-12 dark-glass rounded-3xl p-8 shadow-2xl backdrop-blur-xl items-center">
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Facility</p>
                                <p class="font-medium text-white text-lg">${data.metadata.plant}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Company</p>
                                <p class="font-medium text-white text-lg">${data.metadata.company}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Issue Date</p>
                                <p class="font-medium text-white text-lg">${data.metadata.date}</p>
                            </div>
                            <div>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Status</p>
                                <p class="font-medium text-report-500 flex items-center gap-2 text-lg">
                                    <span class="w-2.5 h-2.5 rounded-full bg-report-500 animate-pulse shadow-[0_0_8px_rgba(79,70,229,0.8)]"></span>
                                    ${data.metadata.status}
                                </p>
                            </div>
                        </div>
                    </div>
                </section>

                <main class="max-w-[1440px] mx-auto px-6 md:px-12 py-24">
                    ${Object.entries(data.sections).map(([sectionKey, sectionObj], idx) => {
                        const sectionNum = String(idx + 1).padStart(2, '0');
                        const subSectionsHtml = renderSubSections(sectionObj.subSections);
                        
                        return `
                            <div class="w-full ${idx > 0 ? 'mt-12 border-t border-slate-200 pt-16' : ''}">
                                ${renderSectionTitle('Section ' + sectionNum, sectionObj.title)}
                                ${subSectionsHtml}
                            </div>
                        `;
                    }).join('')}
                </main>
            `;
            
            app.innerHTML = html;
        });
    </script>
</body>
</html>
