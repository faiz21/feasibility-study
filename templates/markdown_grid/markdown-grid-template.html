<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ document.title }}</title>
    <style>
      :root {
        --bg: #eef2f6;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --line: #cbd5e1;
        --brand: #0b3a63;
        --accent: #0ea5e9;
        --good: #059669;
        --warn: #d97706;
        --bad: #b91c1c;
        {{ theme_css_vars }}
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans",
          "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--ink);
        background: radial-gradient(circle at 15% 0%, #dbeafe, var(--bg) 40%, #f8fafc 100%);
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .container {
        max-width: 1080px;
        margin: 26px auto 42px;
        padding: 0 16px;
        display: grid;
        gap: 18px;
      }
      .doc-header {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .doc-header h1 {
        margin: 0 0 6px;
        font-size: 22px;
        line-height: 1.15;
      }
      .doc-header p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .grid12 {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 14px;
        align-items: start;
      }
      .span-12 {
        grid-column: span 12;
      }
      .span-4,
      .span-6 {
        grid-column: span 12;
      }
      @media (min-width: 900px) {
        .span-lg-4 {
          grid-column: span 4;
        }
        .span-lg-6 {
          grid-column: span 6;
        }
      }
      .block {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        overflow: hidden;
      }
      .h1-block {
        padding: 18px 18px 16px;
        color: white;
        border: none;
        background: linear-gradient(90deg, var(--brand), #0f766e);
      }
      .h1-block h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.01em;
      }
      .h2-block {
        padding: 14px 16px;
        border-left: 6px solid var(--brand);
      }
      .h2-block h3 {
        margin: 0;
        font-size: 16px;
      }
      .card-block h4 {
        margin: 0 0 10px;
        font-size: 14px;
        color: var(--brand);
      }
      .prose p {
        margin: 0 0 10px;
        line-height: 1.6;
      }
      .prose ul,
      .prose ol {
        margin: 0 0 10px;
        padding-left: 18px;
        line-height: 1.55;
      }
      .prose code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        font-size: 12px;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        padding: 2px 6px;
        border-radius: 8px;
      }
      .prose pre {
        margin: 0 0 10px;
        background: #0b1220;
        color: #e2e8f0;
        border-radius: 12px;
        padding: 12px;
        overflow: auto;
        border: 1px solid rgba(226, 232, 240, 0.18);
      }
      .prose pre code {
        background: transparent;
        border: none;
        padding: 0;
        border-radius: 0;
        color: inherit;
        font-size: 12px;
      }
      .anchor {
        color: inherit;
        opacity: 0.85;
      }
      .anchor:hover {
        opacity: 1;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 12px 0;
      }
      .footer {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header class="doc-header">
        <h1>{{ document.title }}</h1>
        <p>Generated {{ generated.at }}</p>
      </header>

      <section class="grid12">
        {{{ content.html }}}
      </section>

      <footer class="footer">Markdown Grid Renderer</footer>
    </main>
  </body>
</html>
