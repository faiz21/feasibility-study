<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Solution Report Template</title>
  <style>
    :root { --bg:#eef2f6; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#cbd5e1; --brand:#0b3a63; --accent:#0284c7; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; background: radial-gradient(circle at top right, #dbeafe, #f8fafc 55%); color: var(--ink); }
    #app { max-width: 980px; margin: 20px auto 40px; padding: 0 14px; display: grid; gap: 16px; }
    article.page { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08); }
    .blk { margin: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .wmk { margin: 0; border: none; border-radius: 0; height: 48px; background-image: linear-gradient(45deg, rgba(15, 23, 42, 0.06) 25%, transparent 25%, transparent 50%, rgba(15, 23, 42, 0.06) 50%, rgba(15, 23, 42, 0.06) 75%, transparent 75%, transparent); background-size: 16px 16px; }
    .hdr { margin: 0; border: none; border-radius: 0; background: linear-gradient(90deg, var(--brand), #0f766e); color: #fff; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .footer { margin: 0; border: none; border-radius: 0; background: #f8fafc; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; }
    .rt h2 { margin: 0 0 8px; font-size: 20px; }
    .rt p { margin: 0 0 8px; line-height: 1.5; }
    .rt ul { margin: 0; padding-left: 18px; line-height: 1.5; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
    .kpi-values { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 8px; }
    .kpi-value { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: #f8fafc; }
    .kpi-value b { display: block; color: var(--brand); font-size: 20px; }
    .chart-placeholder { border: 1px dashed var(--accent); background: #f0f9ff; border-radius: 10px; padding: 10px; font-size: 13px; }
    .step-list { margin: 0; padding-left: 18px; line-height: 1.5; }
    @media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const DEFAULT_DOC = {
      document: {
        title: "MES Planning & Scheduling",
        appCode: "INA-SOL-02",
        client: "PT Indonesia Asahan Aluminium",
        tags: ["mes", "planning", "scheduling"]
      },
      pages: [
        {
          pageId: "cov-p01",
          pageTitle: "Cover",
          layout: [
            { type: "layout.headerBarBrand", id: "cov-hdr-001", data: { headerLabel: "INA-SOL-02", brand: { logo: { alt: "INALUM" } } } },
            { type: "content.longFormOverview", id: "cov-lfo-002", data: { title: "Template Default", body: { blocks: [{ t: "p", text: "Default content is shown until window.__DOC__ is provided." }] } } },
            { type: "layout.footerContactStrip", id: "cov-ftr-003", data: { contacts: [{ kind: "status", value: "default" }], pageNumber: 1 } }
          ]
        }
      ]
    };

    const inbound = window.__DOC__;
    const DOC = inbound && Array.isArray(inbound.pages) && inbound.pages.length > 0 ? inbound : DEFAULT_DOC;
    const R = {};

    function esc(v) {
      return String(v ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderRichText(rt) {
      const blocks = Array.isArray(rt?.blocks) ? rt.blocks : [];
      return `<div class="rt">${blocks.map((b) => {
        if (!b || typeof b !== "object") return "";
        if (b.t === "h2") return `<h2>${esc(b.text)}</h2>`;
        if (b.t === "p") return `<p>${esc(b.text)}</p>`;
        if (b.t === "ul") return `<ul>${(Array.isArray(b.items) ? b.items : []).map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
        return "";
      }).join("")}</div>`;
    }

    function block(title, body, cls = "") {
      return `<section class="blk ${cls}">${title ? `<h3>${esc(title)}</h3>` : ""}${body || ""}</section>`;
    }

    R["layout.watermarkBackgroundPattern"] = (n) => `<section class="blk wmk" data-id="${esc(n.id)}"></section>`;
    R["layout.headerBarBrand"] = (n) => `<section class="blk hdr" data-id="${esc(n.id)}"><span>${esc(n?.data?.headerLabel || "Header")}</span><span>${esc(n?.data?.brand?.logo?.alt || "Brand")}</span></section>`;
    R["layout.footerContactStrip"] = (n) => {
      const contacts = Array.isArray(n?.data?.contacts) ? n.data.contacts : [];
      const parts = contacts.map((c) => `${esc(c.kind)}: ${esc(c.value)}`);
      return `<section class="blk footer" data-id="${esc(n.id)}">${parts.map((p) => `<span>${p}</span>`).join("")}${n?.data?.pageNumber ? `<span>page: ${esc(n.data.pageNumber)}</span>` : ""}</section>`;
    };

    R["content.longFormOverview"] = (n) => block(n?.data?.title || "Overview", renderRichText(n?.data?.body));
    R["content.twoColumnTextBlock"] = (n) => {
      const left = n?.data?.left || {};
      const right = n?.data?.right || {};
      return block("", `<div class="two"><div>${block(left.title || "Left", renderRichText(left.body))}</div><div>${block(right.title || "Right", renderRichText(right.body))}</div></div>`);
    };

    R["table.simple"] = (n) => {
      const cols = Array.isArray(n?.data?.columns) ? n.data.columns : [];
      const rows = Array.isArray(n?.data?.rows) ? n.data.rows : [];
      const head = `<tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
      const body = rows.map((r) => `<tr>${(Array.isArray(r) ? r : []).map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("");
      return block(n?.data?.title || "Table", `<table><thead>${head}</thead><tbody>${body}</tbody></table>`);
    };

    R["chart.barCard"] = (n) => block(n?.data?.title || "Bar Chart", `<div class="chart-placeholder"><strong>chart.barCard placeholder</strong><pre>${esc(JSON.stringify(n?.data || {}, null, 2))}</pre></div>`);

    R["process.workflowStepper"] = (n) => {
      const steps = Array.isArray(n?.data?.steps) ? n.data.steps : [];
      return block(n?.data?.title || "Workflow", `<ol class="step-list">${steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>`);
    };

    R["kpi.card"] = (n) => {
      const metrics = Array.isArray(n?.data?.metrics) ? n.data.metrics : [];
      const cards = `<div class="kpi-values">${metrics.map((m) => `<div class="kpi-value"><b>${esc(m.value)}</b><span>${esc(m.label)}</span></div>`).join("")}</div>`;
      return block(n?.data?.title || "KPI", `${renderRichText(n?.data?.body)}${cards}`);
    };

    R.__unknown = (n) => `<section class="blk"><h3>Unknown component</h3><pre>${esc(JSON.stringify(n, null, 2))}</pre></section>`;

    function renderNode(node) {
      const fn = R[node?.type] || R.__unknown;
      return fn(node || {});
    }

    function renderPage(page) {
      return `<article class="page" data-page-id="${esc(page?.pageId || "")}">${(page?.layout || []).map(renderNode).join("")}</article>`;
    }

    document.getElementById("app").innerHTML = (DOC.pages || []).map(renderPage).join("");
  </script>
</body>
</html>
