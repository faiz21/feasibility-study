<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INALUM Green Plant Automation Audit Report Template</title>
  <style>
    :root {
      --bg: #eef2f6;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --line: #cbd5e1;
      --brand: #0b3a63;
      --accent: #0ea5e9;
      --good: #059669;
      --warn: #d97706;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, #dbeafe, #eef2f6 45%, #f8fafc 100%);
      color: var(--ink);
    }
    #app {
      max-width: 980px;
      margin: 24px auto 40px;
      padding: 0 16px;
      display: grid;
      gap: 20px;
    }
    article.page {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .blk {
      margin: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .wmk {
      height: 54px;
      background-image: linear-gradient(45deg, rgba(15, 23, 42, 0.06) 25%, transparent 25%, transparent 50%, rgba(15, 23, 42, 0.06) 50%, rgba(15, 23, 42, 0.06) 75%, transparent 75%, transparent);
      background-size: 18px 18px;
      border: none;
      margin: 0;
      border-radius: 0;
    }
    .hdr {
      margin: 0;
      border: none;
      border-radius: 0;
      background: linear-gradient(90deg, var(--brand), #0f766e);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .footer {
      margin: 0;
      border: none;
      border-radius: 0;
      background: #f8fafc;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
    }
    .rt h2 { margin: 0 0 8px; font-size: 20px; }
    .rt p { margin: 0 0 8px; line-height: 1.55; }
    .rt ul { margin: 0; padding-left: 18px; line-height: 1.5; }
    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .chart-placeholder {
      border: 1px dashed var(--accent);
      background: #f0f9ff;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
    }
    .kpi-values {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .kpi-value {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .kpi-value b { display: block; font-size: 22px; color: var(--brand); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .step-list {
      margin: 0;
      padding-left: 18px;
      line-height: 1.5;
    }
    .doc-banner {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    .doc-banner h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }
    .doc-banner p {
      margin: 0 0 8px;
      color: var(--muted);
    }
    .doc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
    }
    .doc-meta span {
      background: #e2e8f0;
      border-radius: 999px;
      padding: 4px 10px;
      color: #0f172a;
    }
    @media (max-width: 720px) {
      .two { grid-template-columns: 1fr; }
      #app { padding: 0 10px; }
      .blk { margin: 10px; padding: 10px; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const DEFAULT_DOC = {
      schemaVersion: 1,
      document: {
        appCode: "INA-PL-GRP",
        title: "Automation Audit Report (L1-L3)",
        client: "PT Indonesia Asahan Aluminium",
        plant: "Green Plant",
        scope: "INA-PL-GRP",
        date: "2026-02-23",
        tags: ["automation-audit", "feasibility", "green-plant"],
        locale: "en"
      },
      pages: [
        {
          schemaVersion: 1,
          pageId: "cov-p01",
          pageTitle: "Cover",
          layout: [
            {
              type: "report.layout.watermark",
              id: "cov-wmk-001",
              data: { patternKey: "grid-dots", opacity: 0.06 }
            },
            {
              type: "report.layout.headerBar",
              id: "cov-hdr-002",
              data: { headerLabel: "AUTOMATION AUDIT REPORT TEMPLATE", brand: { logo: { src: "", alt: "INALUM" } } }
            },
            {
              type: "report.text.narrativeBlock",
              id: "cov-lfo-003",
              data: {
                title: "PT Indonesia Asahan Aluminium - Green Plant",
                body: {
                  blocks: [
                    { t: "h2", text: "Template Default Content" },
                    { t: "p", text: "This HTML template includes built-in default content for the INALUM Green Plant automation audit so the page renders before external JSON is loaded." },
                    { t: "ul", items: ["Scope: L1-L3 automation maturity", "Process groups covered: 8", "Assessment date: 23 February 2026"] }
                  ]
                }
              }
            },
            {
              type: "report.metric.resultMetricCard",
              id: "cov-kpi-004",
              data: {
                title: "Default Snapshot",
                body: { blocks: [{ t: "p", text: "Baseline metrics shown here are default placeholders tied to the audit narrative." }] },
                metrics: [
                  { value: "8", label: "Process groups in scope" },
                  { value: "3", label: "Automation levels assessed" }
                ]
              }
            },
            {
              type: "report.layout.footerStrip",
              id: "cov-ftr-005",
              data: {
                contacts: [
                  { kind: "client", value: "PT Indonesia Asahan Aluminium" },
                  { kind: "plant", value: "Green Plant" },
                  { kind: "scope", value: "INA-PL-GRP" }
                ],
                pageNumber: 1
              }
            }
          ]
        },
        {
          schemaVersion: 1,
          pageId: "es-p02",
          pageTitle: "1. Executive Summary",
          layout: [
            {
              type: "report.layout.headerBar",
              id: "es-hdr-001",
              data: { headerLabel: "1. EXECUTIVE SUMMARY", brand: { logo: { src: "", alt: "INALUM" } } }
            },
            {
              type: "report.text.narrativeBlock",
              id: "es-lfo-002",
              data: {
                title: "Green Plant Automation Baseline",
                body: {
                  blocks: [
                    { t: "p", text: "The Green Plant shows a mixed baseline: core PLC control exists, but manual intervention and fragmented integration limit optimisation readiness." },
                    { t: "ul", items: ["L1 partially established", "L2 fragmented", "L3 requires foundational upgrades"] }
                  ]
                }
              }
            },
            {
              type: "report.section.multiColumn",
              id: "es-2ct-003",
              data: {
                left: {
                  title: "Key Risks",
                  body: {
                    blocks: [
                      { t: "ul", items: ["Sensor trust degradation in dusty areas", "Weak alarm/event history", "Recurring choking and bridging events"] }
                    ]
                  }
                },
                right: {
                  title: "Immediate Priorities",
                  body: {
                    blocks: [
                      { t: "ul", items: ["Restore critical protective sensing", "Implement baseline alarm/event logging", "Validate mass flow and stock measurement trust"] }
                    ]
                  }
                }
              }
            },
            {
              type: "report.layout.footerStrip",
              id: "es-ftr-004",
              data: {
                contacts: [
                  { kind: "section", value: "Executive Summary" },
                  { kind: "date", value: "2026-02-23" },
                  { kind: "scope", value: "INA-PL-GRP" }
                ],
                pageNumber: 2
              }
            }
          ]
        },
        {
          schemaVersion: 1,
          pageId: "rd-p03",
          pageTitle: "2. Roadmap Snapshot",
          layout: [
            {
              type: "report.layout.headerBar",
              id: "rd-hdr-001",
              data: { headerLabel: "ROADMAP SNAPSHOT", brand: { logo: { src: "", alt: "INALUM" } } }
            },
            {
              type: "report.list.squareNumberedList",
              id: "rd-wfs-002",
              data: {
                title: "Phase Sequence",
                steps: [
                  "Phase 0: Verification and baseline closure",
                  "Phase 1: L1 integrity hardening",
                  "Phase 2: L2 supervisory consolidation",
                  "Phase 3: L3 structured reporting enablement"
                ]
              }
            },
            {
              type: "report.table.table",
              id: "rd-tbl-003",
              data: {
                title: "Roadmap Deliverables",
                columns: ["Phase", "Goal", "Deliverable"],
                rows: [
                  ["0", "Baseline closure", "Validated I/O and sensor map"],
                  ["1", "Integrity hardening", "Protective sensing restored"],
                  ["2", "Supervisory consolidation", "Plant alarm/event history"],
                  ["3", "Structured reporting", "Stop-cause and KPI governance"]
                ]
              }
            },
            {
              type: "report.layout.footerStrip",
              id: "rd-ftr-004",
              data: {
                contacts: [
                  { kind: "section", value: "Roadmap Snapshot" },
                  { kind: "client", value: "PT Indonesia Asahan Aluminium" }
                ],
                pageNumber: 3
              }
            }
          ]
        }
      ]
    };
    const inboundDoc = window.__DOC__;
    const DOC = inboundDoc && Array.isArray(inboundDoc.pages) && inboundDoc.pages.length > 0 ? inboundDoc : DEFAULT_DOC;
    const R = {};

    function esc(v) {
      return String(v ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderRichText(rt) {
      const blocks = Array.isArray(rt?.blocks) ? rt.blocks : [];
      return `<div class="rt">${blocks.map((b) => {
        if (!b || typeof b !== "object") return "";
        if (b.t === "h2") return `<h2>${esc(b.text)}</h2>`;
        if (b.t === "p") return `<p>${esc(b.text)}</p>`;
        if (b.t === "ul") {
          const items = Array.isArray(b.items) ? b.items : [];
          return `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
        }
        return "";
      }).join("")}</div>`;
    }

    function block(title, body, cls = "") {
      return `<section class="blk ${cls}">${title ? `<h3>${esc(title)}</h3>` : ""}${body || ""}</section>`;
    }

    R["report.layout.watermark"] = (node) => {
      return `<section class="blk wmk" data-id="${esc(node.id)}"></section>`;
    };

    R["report.layout.headerBar"] = (node) => {
      const label = node?.data?.headerLabel || "Header";
      const alt = node?.data?.brand?.logo?.alt || "Brand";
      return `<section class="blk hdr" data-id="${esc(node.id)}"><span>${esc(label)}</span><span>${esc(alt)}</span></section>`;
    };

    R["report.layout.footerStrip"] = (node) => {
      const contacts = Array.isArray(node?.data?.contacts) ? node.data.contacts : [];
      const parts = contacts.map((c) => `${esc(c.kind)}: ${esc(c.value)}`);
      const pageNo = node?.data?.pageNumber;
      return `<section class="blk footer" data-id="${esc(node.id)}">${parts.map((p) => `<span>${p}</span>`).join("")}${pageNo ? `<span>page: ${esc(pageNo)}</span>` : ""}</section>`;
    };

    R["report.text.narrativeBlock"] = (node) => {
      const title = node?.data?.title || "Overview";
      const content = node?.data?.content || "";
      const bullets = Array.isArray(node?.data?.bullets) ? node.data.bullets : [];
      const html = `
        <div class="rt">
          ${content ? `<p>${esc(content)}</p>` : ""}
          ${bullets.length ? `<ul>${bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        </div>
      `;
      return block(title, html);
    };

    R["report.section.multiColumn"] = (node) => {
      const left = node?.data?.left || {};
      const right = node?.data?.right || {};
      const html = `
        <div class="two">
          <div>${block(left.title || "Left", `<div class="rt"><p>${esc(left.content || "")}</p>${Array.isArray(left.bullets) && left.bullets.length ? `<ul>${left.bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}</div>`)}</div>
          <div>${block(right.title || "Right", `<div class="rt"><p>${esc(right.content || "")}</p>${Array.isArray(right.bullets) && right.bullets.length ? `<ul>${right.bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}</div>`)}</div>
        </div>
      `;
      return block("", html);
    };

    R["report.table.table"] = (node) => {
      const title = node?.data?.title || "Table";
      const columns = Array.isArray(node?.data?.headers) ? node.data.headers : [];
      const rows = Array.isArray(node?.data?.rows) ? node.data.rows : [];
      const head = `<tr>${columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
      const body = rows.map((r) => `<tr>${(Array.isArray(r) ? r : []).map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("");
      return block(title, `<table><thead>${head}</thead><tbody>${body}</tbody></table>`);
    };

    R["report.chart.charts"] = (node) => {
      const title = node?.data?.title || "Bar Chart";
      const series = Array.isArray(node?.data?.series) ? node.data.series : [];
      const items = series.map((s) => `${esc(s.label)}: ${esc(s.value)}`).join("<br/>");
      return block(title, `<div class="chart-placeholder"><strong>Chart data:</strong><br/>${items || "No series"}</div>`);
    };

    R["report.metric.gaugeNarrativeGrid"] = (node) => {
      const title = node?.data?.title || "Gauge";
      const items = Array.isArray(node?.data?.items) ? node.data.items : [];
      const rows = items.map((i) => `${esc(i.label)}: ${esc(i.percent)}%`).join("<br/>");
      const narrative = node?.data?.narrative ? `<p>${esc(node.data.narrative)}</p>` : "";
      return block(title, `<div class="chart-placeholder"><strong>Gauge data:</strong><br/>${rows || "No items"}${narrative}</div>`);
    };

    R["report.metric.resultMetricCard"] = (node) => {
      const title = node?.data?.title || "KPI";
      const metrics = Array.isArray(node?.data?.metrics) ? node.data.metrics : [];
      const cards = `<div class="kpi-values">${metrics.map((m) => `<div class="kpi-value"><b>${esc(m.value)}</b><span>${esc(m.label)}</span></div>`).join("")}</div>`;
      return block(title, cards);
    };

    R["report.list.squareNumberedList"] = (node) => {
      const title = node?.data?.title || "Workflow";
      const items = Array.isArray(node?.data?.items) ? node.data.items : [];
      const body = `<ol class="step-list">${items.map((s) => `<li><strong>${esc(s.title || "Step")}</strong><br/>${esc(s.description || "")}</li>`).join("")}</ol>`;
      return block(title, body);
    };

    R.__unknown = (node) => {
      return `<section class="blk"><h3>Unknown component</h3><pre>${esc(JSON.stringify(node, null, 2))}</pre></section>`;
    };

    function renderNode(node) {
      const fn = R[node?.type] || R.__unknown;
      return fn(node || {});
    }

    function renderPage(page) {
      const blocks = (page?.layout || []).map(renderNode).join("");
      return `<article class="page" data-page-id="${esc(page?.pageId || "")}">${blocks}</article>`;
    }

    function renderDocBanner(documentMeta) {
      const meta = documentMeta || {};
      const tags = Array.isArray(meta.tags) ? meta.tags : [];
      return `
        <section class="doc-banner">
          <h1>Automation Audit Report Template</h1>
          <p>Default template for INALUM Green Plant. External JSON (`window.__DOC__`) will override this content when provided.</p>
          <div class="doc-meta">
            <span>AppCode: ${esc(meta.appCode || "INA-PL-GRP")}</span>
            <span>Client: ${esc(meta.client || "PT Indonesia Asahan Aluminium")}</span>
            <span>Plant: ${esc(meta.plant || "Green Plant")}</span>
            <span>Date: ${esc(meta.date || "2026-02-23")}</span>
            ${tags.map((t) => `<span>${esc(t)}</span>`).join("")}
          </div>
        </section>
      `;
    }

    document.getElementById("app").innerHTML = [
      renderDocBanner(DOC.document),
      (DOC.pages || []).map(renderPage).join("")
    ].join("");
  </script>
</body>
</html>
