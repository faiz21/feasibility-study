<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INALUM OT Cybersecurity Assessment Template</title>
  <style>
    :root { --bg:#eef2f6; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#cbd5e1; --brand:#0b3a63; --accent:#0284c7; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"IBM Plex Sans","Segoe UI",sans-serif; color:var(--ink); background:linear-gradient(180deg,#e0f2fe,#f8fafc); }
    #app { max-width:980px; margin:22px auto 36px; padding:0 14px; display:grid; gap:16px; }
    article.page { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 8px 20px rgba(15,23,42,.08); }
    .blk { margin:12px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .wmk { margin:0; border:none; height:46px; border-radius:0; background-image:linear-gradient(45deg,rgba(15,23,42,.06) 25%,transparent 25%,transparent 50%,rgba(15,23,42,.06) 50%,rgba(15,23,42,.06) 75%,transparent 75%,transparent); background-size:16px 16px; }
    .hdr { margin:0; border:none; border-radius:0; background:linear-gradient(90deg,var(--brand),#0f766e); color:#fff; display:flex; justify-content:space-between; align-items:center; font-weight:700; }
    .footer { margin:0; border:none; border-radius:0; background:#f8fafc; color:var(--muted); display:flex; flex-wrap:wrap; gap:10px; font-size:12px; }
    .rt h2 { margin:0 0 8px; font-size:20px; }
    .rt p { margin:0 0 8px; line-height:1.5; }
    .rt ul { margin:0; padding-left:18px; line-height:1.5; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    .chart-placeholder { border:1px dashed var(--accent); background:#f0f9ff; border-radius:10px; padding:10px; font-size:13px; }
    .kpi-values { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-top:8px; }
    .kpi-value { background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:8px; }
    .kpi-value b { display:block; font-size:20px; color:var(--brand); }
    .step-list { margin:0; padding-left:18px; }
    @media (max-width:720px) { .two{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const DEFAULT_DOC = {
      document: {
        appCode: "INA-OT-CYB",
        title: "Cybersecurity Assessment Report",
        client: "PT Indonesia Asahan Aluminium",
        plant: "Operational Technology Environment",
        date: "2026-02-28",
        tags: ["ot", "cybersecurity", "assessment"]
      },
      pages: [
        {
          pageId: "cov-p01",
          pageTitle: "Cover",
          layout: [
            { type: "layout.watermarkBackgroundPattern", id: "cov-wmk-001", data: { patternKey: "geo-lines", opacity: 0.06 } },
            { type: "layout.headerBarBrand", id: "cov-hdr-002", data: { headerLabel: "CYBERSECURITY ASSESSMENT REPORT", brand: { logo: { src: "", alt: "INALUM" } } } },
            { type: "content.longFormOverview", id: "cov-lfo-003", data: { title: "INALUM OT Cybersecurity", body: { blocks: [
              { t: "p", text: "Default content renders until external JSON is supplied." },
              { t: "ul", items: ["Score: 34.29%", "Risk tier: High", "Scope: OT cybersecurity controls"] }
            ] } } },
            { type: "layout.footerContactStrip", id: "cov-ftr-004", data: { contacts: [ {kind:"client",value:"PT Indonesia Asahan Aluminium"}, {kind:"scope",value:"OT"} ], pageNumber: 1 } }
          ]
        }
      ]
    };
    const inboundDoc = window.__DOC__;
    const DOC = inboundDoc && Array.isArray(inboundDoc.pages) && inboundDoc.pages.length ? inboundDoc : DEFAULT_DOC;
    const R = {};

    const esc = (v) => String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");

    function renderRichText(rt) {
      const blocks = Array.isArray(rt?.blocks) ? rt.blocks : [];
      return `<div class="rt">${blocks.map((b)=>{
        if (!b || typeof b !== "object") return "";
        if (b.t === "h2") return `<h2>${esc(b.text)}</h2>`;
        if (b.t === "p") return `<p>${esc(b.text)}</p>`;
        if (b.t === "ul") return `<ul>${(Array.isArray(b.items)?b.items:[]).map((i)=>`<li>${esc(i)}</li>`).join("")}</ul>`;
        return "";
      }).join("")}</div>`;
    }

    function block(title, body, cls = "") { return `<section class="blk ${cls}">${title ? `<h3>${esc(title)}</h3>` : ""}${body || ""}</section>`; }

    R["layout.watermarkBackgroundPattern"] = (n) => `<section class="blk wmk" data-id="${esc(n.id)}"></section>`;
    R["layout.headerBarBrand"] = (n) => `<section class="blk hdr" data-id="${esc(n.id)}"><span>${esc(n?.data?.headerLabel || "Header")}</span><span>${esc(n?.data?.brand?.logo?.alt || "Brand")}</span></section>`;
    R["layout.footerContactStrip"] = (n) => {
      const contacts = Array.isArray(n?.data?.contacts) ? n.data.contacts : [];
      const parts = contacts.map((c) => `${esc(c.kind)}: ${esc(c.value)}`);
      return `<section class="blk footer" data-id="${esc(n.id)}">${parts.map((p)=>`<span>${p}</span>`).join("")}${n?.data?.pageNumber ? `<span>page: ${esc(n.data.pageNumber)}</span>` : ""}</section>`;
    };
    R["content.longFormOverview"] = (n) => block(n?.data?.title || "Overview", renderRichText(n?.data?.body));
    R["content.twoColumnTextBlock"] = (n) => block("", `<div class="two"><div>${block(n?.data?.left?.title || "Left", renderRichText(n?.data?.left?.body))}</div><div>${block(n?.data?.right?.title || "Right", renderRichText(n?.data?.right?.body))}</div></div>`);
    R["table.simple"] = (n) => {
      const cols = Array.isArray(n?.data?.columns) ? n.data.columns : [];
      const rows = Array.isArray(n?.data?.rows) ? n.data.rows : [];
      const head = `<tr>${cols.map((c)=>`<th>${esc(c)}</th>`).join("")}</tr>`;
      const body = rows.map((r)=>`<tr>${(Array.isArray(r)?r:[]).map((v)=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("");
      return block(n?.data?.title || "Table", `<table><thead>${head}</thead><tbody>${body}</tbody></table>`);
    };
    R["chart.barCard"] = (n) => block(n?.data?.title || "Bar Chart", `<div class="chart-placeholder"><strong>Chart placeholder:</strong> chart.barCard<pre>${esc(JSON.stringify(n?.data || {}, null, 2))}</pre></div>`);
    R["chart.gaugeSegments"] = (n) => block(n?.data?.title || "Gauge", `<div class="chart-placeholder"><strong>Chart placeholder:</strong> chart.gaugeSegments<pre>${esc(JSON.stringify(n?.data || {}, null, 2))}</pre></div>`);
    R["kpi.card"] = (n) => {
      const metrics = Array.isArray(n?.data?.metrics) ? n.data.metrics : [];
      const cards = `<div class="kpi-values">${metrics.map((m)=>`<div class="kpi-value"><b>${esc(m.value)}</b><span>${esc(m.label)}</span></div>`).join("")}</div>`;
      return block(n?.data?.title || "KPI", `${renderRichText(n?.data?.body)}${cards}`);
    };
    R["process.workflowStepper"] = (n) => block(n?.data?.title || "Workflow", `<ol class="step-list">${(Array.isArray(n?.data?.steps)?n.data.steps:[]).map((s)=>`<li>${esc(s)}</li>`).join("")}</ol>`);
    R.__unknown = (n) => `<section class="blk"><h3>Unknown component</h3><pre>${esc(JSON.stringify(n, null, 2))}</pre></section>`;

    function renderNode(node) { const fn = R[node?.type] || R.__unknown; return fn(node || {}); }
    function renderPage(page) { return `<article class="page" data-page-id="${esc(page?.pageId || "")}">${(page?.layout || []).map(renderNode).join("")}</article>`; }

    const header = `<section class="blk"><h2>${esc(DOC?.document?.title || "Cybersecurity Assessment Report")}</h2><p>Template for INALUM OT cybersecurity assessment. External JSON via <code>window.__DOC__</code> will override default content.</p></section>`;
    document.getElementById("app").innerHTML = `${header}${(DOC.pages || []).map(renderPage).join("")}`;
  </script>
</body>
</html>
